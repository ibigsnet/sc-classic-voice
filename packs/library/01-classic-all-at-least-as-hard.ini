item_Desc_qrt_mantis_undersuit_helmet_02_02_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nGet a clear view of everything around you with the Calva helmet from Quirinus Tech. The large face shield made from proprietary synthetic sapphire provides scratch resistance while remaining just as thin and light as typical materials.\n\nThis special Red Festival variant features deep red and gleaming gold accents with an all gold visor to help give your lunar new year an auspicious start.
item_Desc_qrt_specialist_medium_arms_01_03=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nBlending durability and a striking style, the Artimex armor exemplifies the Quirinus aesthetic. This intricately detailed armor considers both form and function, especially when paired with the fully enclosed helmet that features a neon ocular flourish. The armor also comes with a unique cowl that fans over the helmet and a knee length fitted cape.\n\nThe Elysium edition combines bright gold detailings of winged skulls with a navy blue.
item_Desc_qrt_specialist_medium_core_01_03=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 6.4 µSCU\nBackpacks: Medium, Light\n\nBlending durability and a striking style, the Artimex armor exemplifies the Quirinus aesthetic. This intricately detailed armor considers both form and function, especially when paired with the fully enclosed helmet that features a neon ocular flourish. The armor also comes with a unique cowl that fans over the helmet and a knee length fitted cape.\n\nThe Elysium edition combines bright gold detailings of winged skulls with a navy blue.
