Journal_General_Mining_Content=Mining has, and will always remain, a proud tradition of Humanity. For over eight centuries United Resource Workers guild has been protecting miners’ rights, ensuring that they have the tools, protection, and knowledge they need to build our future. And while the technology available today has certainly made mining more efficient, the individual skills and instincts of a miner have never been more important.\n\nIn this guide, we’ll be covering the ‘Fundamentals of Mining’, breaking it down into the three core elements of modern-day ship mining: SCANNING, FRACTURING, and EXTRACTION.\n\nLet’s get started -\n\nSCANNING\nThe first thing any miner will need to do is find a deposit that can be mined, and most importantly, one worth mining. Ships equipped with a scanner can send out a local pulse that detects all the nearby minable rocks but be careful: this also makes nearby ships aware of you too.\n\nOnce you’ve found a deposit, enter your ship’s Mining Mode and aim your reticle at the rock to learn some key information including:\n\nComposition - the breakdown of what elements are inside the deposit.\n\nResistance - how much energy it will take to fracture the rock.\n\nInstability - how much energy fluctuation will occur while mining.\n\nYou’ll also be able to see the difficulty of mining the deposit based on your current equipment. We advised beginners to stick with easy rocks, but no matter your skill, an impossible rock isn’t worth attempting.\n\nOnce you find a deposit with readings you like, it’s time to enter the next stage.\n\nFRACTURING\nThis is where the miner’s skills and instincts become especially important. The aim of fracturing is to use a mining laser to break apart large rocks into smaller ones so the valuable materials inside can be safely harvested.\n\nSwitch your ship into Fracture Mode and you’ll see some new meters appear on your Heads Up Display (HUD). \n\nActivate your mining laser and slowly increase the Laser Intensity until you enter the green Optimal Zone. Once you get the Charge Level inside the Optimal Zone, continue making small adjustments to keep it from dropping out of the sweet spot, or overshooting it and entering the red Overcharge Zone. Keep this up until the Optimal Zone fills completely and the deposit breaks into a few smaller pieces. \n\nMost of these pieces should be highlighted in purple and ready for the next stage, Extraction, but some pieces may need to be fractured again.\n\nEXTRACTION\nActivate Extraction Mode and move your beam over the fractured fragments to collect them. Continue gathering the materials until they’ve been completely collected, or until your Cargo Capacity is full.\n\nWhat’s next?\nTime to reap the rewards. Some miners may be inclined to sell their ore as is, but to maximize profit or to complete a specific workorder, you’ll want to take your ship’s cargo to a refinery and get them processed. Refineries can be found at major spaceports and stations.\n\nNow that you’ve got everything you need to start ship mining, get out there and give it a go. Once you’ve mastered the basics, there’s plenty more skills to unearth such as: Modules, Gadgets, Lasers, Ground Vehicles, and Personal Mining. \n\nSo, what are you waiting for? There’s a whole ‘verse of mining waiting for you to discover.\n
Journal_General_Mining_Title=The Fundamentals of Mining
Journal_General_Salvaging_Content=From precision hull scraping to full-scale material and component recovery, salvaging offers one of the most profitable and versatile careers in the 'verse. Whether flying solo or as part of a crew, each wreck presents a chance to explore, recover, and profit from the remains of the stars.\n\nJoin us as we explore the systems and tools that define this rewarding profession…\n\nTYPES OF SALVAGE\n\n*** Components & Cargo ***\n\nBefore tearing down a wreck, it's always worth checking its interior and systems for anything still intact or valuable. Many derelicts still hold functional components, weapons, or cargo that can be retrieved using precision tractor beams before the hull is stripped away.\n\nDepending on the vessel you’re salvaging, the components might be locked and you will first have to unlock them via the cockpit controls aboard the wreckage before they can be pulled free. Once detached, these items can be stored aboard your ship if you have available space in the cargo grid.\n\n*** Hull Scraping ***\n\nHull scraping is the foundation of modern salvage operations, allowing operators to reclaim valuable Recycled Material Composite (RMC) from the outside of derelict ships, converting wreckages into usable resources for trade, repair, or resale. \n\nIf you will be using a specialized salvaging vehicle, you will need to first enter salvage mode before you can begin. There you will have access to a informative HUD that will display the percentage of the remaining target hull, optimal range, and how much available storage space you have. \n\nOnce your RMC storage is full, many salvaging vehicles come with an onboard processing unit that can produce SCU containers from the RMC you’ve collected. Depending on your ship, RMC can also be converted into RMC canisters used by salvage and repair hand tools. \n\n*** Structural Salvage ***\n\nStructural salvage takes recovery operations beyond the surface, breaking down derelicts into their raw framework to harvest useful commodities. The process begins with "Fracturing Mode," which cracks the derelict hulls into smaller parts. This is followed by "Disintegration Mode," which further breaks down the wreckage, yielding various unrefined Construction Materials ranging from "Construction Rubble" to "Construction Pieces" to "Construction Salvage" depending on the salvaging ship used.\n\nConstruction Materials recovered in structural salvage will often need to be refined before selling, with results varying by salvage ship type: Rubble from Light Salvage ships offers the fastest processing but lowest yield, Pieces from Medium Salvage ships provide balanced results, and Salvage from Heavy Salvage ships delivers the highest refined return at the cost of longer processing times.\n\nTo use a rest stop’s refinery, you must first unload your salvaged materials via a freight elevator into the station's inventory before starting the refinement job. You can choose between different processing methods that affect the yield, cost, and time of the refinement.\n\nNEXT STEPS\n\n*** Sell Your Spoils ***\n\nWhile many salvagers prefer to do contracted work, plenty of operators prefer instead to sell their reclaimed materials on the open market. Once you've got SCU containers full of RMC or Construction Materials, head to a commodity kiosk at a landing zone or rest stops and sell them. However, not all kiosks will purchase these recycled materials, and don't forget to keep an eye on the price to make sure you're getting the best deal you can\n\n*** Ready to Repair ***\n\nIf you created RMC canisters at your onboard filler station and you've got your SRT Multi-Tool attachment handy, you can use the RMC to repair damage. You can significantly repair a hull but not fully. To fully restore your ship's hull, you'll need to take it to a landing pad or hangar that offers repair services.\n
