ea_ui_frontend_specialevent_AprilFools_Description=You're not dreaming. Now you can play Arena Commander from your bedroom! To celebrate Triggerfish this April, you and your friends can compete in a brand new map set inside an EZ Hab.
ea_ui_frontend_specialevent_Halloween_Description=Compete in a spooky showdown this Day of the Vara and battle against an army of undead skeletons in Kill Collector (FPS). Keep winning to earn three sets of revolting rewards!
fleetweek2950_holoviewer_g12_desc=While larger vehicles like the Tumbril Nova and Anvil Ballista may be better known for their military might, the UEE deploys thousands of smaller tactical vehicles in defense of the Empire. More easily transported to provide greater mission flexibility, these rovers and gravlevs often allow tactical responsiveness to a wider variety of terrain and scenarios. When atmospheric conditions become hostile and can impede flight, having a varied motor pool at your disposal can make all the difference.\n\nOne of the newest rovers to join the ranks is the G12a from Origin Jumpworks. While it may have the sleek lines the manufacturer is known for, the G12a is reinforced with heavier armor and fortified wheels, and comes armed with a full defensive and offensive suite. When deployed, it will initially serve as a patrol vehicle for landing sites located in active combat areas with severe weather patterns.\n
harvestable_Armillaria_Lev_desc=First discovered in the sewer lines at the QV Mining Station built into the Delemar asteroid in Nyx, this quick growing fungus has become a useful manufacturing component for the settlers of Levski thanks to the strong mycelium fibers that can be dried and used in a variety of ways.
hauling_deliver_resource_objective_01=Deliver ~mission(amount)/~mission(total) ~mission(item)s to ~mission(Destination|Address|ListAll).
headhunters_Nyx_bombingrun_M_desc_001=Seems we got a bit of competition out here in Nyx. Scouts have spotted a gang holding up at  <EM4>~mission(Location|Address)</EM4>.\n\nNow, I'm a fair man. I sent these nullbrains a message saying they either vacate the facility or we make them wish they had, and they made their choice. So now I need you to fly over there and bomb the life out of the fuel tanks. Let's see how long they stick around without them.\n\n-Stows out
headhunters_bombingrun_S_desc_001=We've heard news that a new gang are planning a bombing run on a place over at <EM4>~mission(Location|Address)</EM4>. They figure if they can take out the fuel supplies there then it's theirs for the taking.\n\nBut little do they know that we're gonna send you in first to blow the fuel tanks so we can claim the place before they do. If it all goes to plan, we can clear the location out and stick it to that gang at the same time. Two birds, one stone.\n\nOnly problem is this place is armed to the teeth. Bring a crew and get those fuel tanks out of action. We'll take care of the rest.\n\n-Stows out
headhunters_bombingrun_multi_E_CFP_desc_001=Every day it seems like Citizens for Prosperity is out here trying to snatch up more people for their shitty little cause and make life more difficult for hardworkin' folks like ourselves. \n\nI figure they could use a reminder about who really is in charge here. Head to ~mission(Location|Address) and bomb the living hell out of the area. \n\nNothing like a bit of property damage to get a point across.\n\n-Stows out
hud_CSTM=CSTM
iae2953_sign_cargo_leftdiorama_body=Whatever the cargo, it’s usually shipped in a box – but not all boxes are made the same. Not only do they range in scale and size, but some are also specifically designed to handle more exotic, or unstable, materials like refined quantanium.
