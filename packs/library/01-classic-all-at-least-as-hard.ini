item_desc_FLBL_AEGS_Avenger_Handling=Manufacturer: Broad & Rabiee\nType: Flight Blade\n\nUnlock the potential of your Aegis Avenger with the PHB Flight Blade from Broad & Rabiee. By re-allocating forward thrust resources, you can expect your ship deliver increased precision handling during tight maneuvers.
