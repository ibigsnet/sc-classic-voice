item_Desc_doom_combat_medium_backpack_01=Item Type: Medium Backpack\nCarrying Capacity: 70K µSCU\nCore Compatibility: Medium & Heavy\n\nStop lugging all your loot by hand. The Sinkhole backpack gives you plenty of space to store everything you need, while leaving your hands free for whatever mischief you have in mind.
item_Desc_fta_medium_helmet_01_01_05=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -50 / 80 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nMade for miners but ready for any adventure, Greycat Industrial's Strata armor provides premium protection and convenient features. Each piece features an angular and precise design to deliver coverage where it's most needed most. A toolbelt with convenient pouches and a reinforced backpack offers plenty of storage. The award-winning helmet design features high quality materials and a next-gen air filtration system that enables clean breathing whether in a deep mine or hostile atmospheres. The Shooting Star edition is light grey with yellow highlights.
item_Desc_gsb_frontier_boots_01_02_11,P=PLACEHOLDER
item_Desc_gys_undersuit_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nConfidently venture into the unknown with the Deep-Space undersuit. Smartly designed with several overlapping sections to guarantee the suit's integrity, Gyson has created an affordable and fashionable undersuit that helps make space travel more accessible to all.
item_Desc_hdtc_undersuit_01_01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nThe Lamont looks so good you won't want to wear armor over it. Seamlessly blending lightweight plating with durable synthetic weaves, the Lamont will be as comfortable in the cockpit as it is stylish in the streets. Embrace personal protection gear suitable for both work and play, and gain the Hardin Tactical advantage.
item_Desc_hdtc_undersuit_01_01_02=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\nCarrying Capacity: 8.0 µSCU\n \nThe Lamont looks so good you won't want to wear armor over it. Seamlessly blending lightweight plating with durable synthetic weaves, the Lamont will be as comfortable in the cockpit as it is stylish in the streets. Embrace personal protection gear suitable for both work and play, and gain the Hardin Tactical advantage.\n \nThe Xy'kara undersuit draws inspiration from the millennia-long heritage of the Xi'an.
item_Desc_kap_combat_light_arms_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven info the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps. 
item_Desc_kap_combat_light_arms_02_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven info the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps.\n\nThe ASD Edition features a hooded cloak printed with a dark urban camo pattern alongside ASD's signature logo.
