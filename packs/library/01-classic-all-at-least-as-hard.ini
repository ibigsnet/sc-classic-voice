BHG_Certification_EscapedConvict_Desc,P=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Stanton \nRISK ASSESSMENT: High\nLAST KNOWN LOCATION: Klescher Rehabilitation Facility\nKNOWN AFFILIATIONS: <None>\nNOTES: Due to an increase in escapees in the area, the Bounty Hunters Guild would like to offer you the chance to earn your Fugitive Recovery Certification.\n\nThis would signify that you are qualified to track and apprehend escaped convicts. These desperate individuals can often prove quite difficult to recapture, requiring special skills and heightened intuition.\n\nTo successfully complete this certification process, you must apprehend the fugitive <EM4>~mission(TargetName)</EM4>.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.
BHG_Certification_Medium_Desc,P=--------------------------------------------------------\n----------------- BOUNTY CONTRACT -----------------\n--------------------------------------------------------\n\nBOUNTY HUNTERS GUILD\nPROCESSING & DISTRIBUTION\n\nThe Bounty Hunters Guild has authorized an official bounty.\n\nNAME: ~mission(TargetName) \nSYSTEM: Stanton \nRISK ASSESSMENT: Moderate\nLAST KNOWN LOCATION: ~mission(Location)\nKNOWN AFFILIATIONS: <None>\nNOTES: With the progress you have made in developing your skills, the Bounty Hunters Guild would like to offer you the chance to earn your full Tracker License.\n\nThis license would signify that you are qualified to track and apprehend Moderate-Risk Targets (MRT). These criminals traditionally fly medium-sized ships with several escorts. This class of outlaws make up a bulk of the contracts that typical bounty hunters will encounter.\n\nTo successfully complete this certification process, you must apprehend a MRT ranked criminal by the name of <EM4>~mission(TargetName)</EM4> last seen at <EM4>~mission(Location|Address)</EM4>.\n\n\nBOUNTY HUNTERS GUILD\nIn Pursuit of Justice\n\nThe Bounty Hunters Guild is a security service sanctioned by the Mercenary Guild and authorized to operate in both the UEE and beyond in accordance with Xenotrade Authority Acts.
Badge_CleanAir_Personal_T4_Desc=You have been awarded: Perseus Alliance Aid Camo Livery
Battaglia_RPT_RecoverItem_VH_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blackbox Retrieval Very Dangerous\n\nWORK BRIEF: \nThere's been another attack out at ~mission(Location). Whoever did it killed the entire crew in the ambush. The Governing Committee wants answers so we're looking for someone to head out there, <EM4>retrieve the blackbox and deliver it ~mission(Destination)</EM4>. Make sure you <EM4>bring a ship with some storage to hold the blackbox</EM4>.\n\nBe incredibly careful. They said it was a large group that attacked them, and I'd be <EM4>they're still in the area</EM4>.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco
BitZeros_blackbox_E_Desc_001=So we were expecting a pretty important package earlier today but turns out the pilot got ghosted and they ripped the tracking chip from it and got away. Pretty clever right? Not really, because they forgot to take the flight recorder too.\n\nGet the blackbox from the wreck at <EM4>~mission(Location|Address)</EM4> and take it to <EM4>~mission(Destination|Address)</EM4>. We’ll send you the creds when you’re done.\n\nOh and watch out for scavs, people are pretty desperate these days, even if it just some busted courier ship.\n\n-Bit Zeros
BitZeros_blackbox_H_Desc_001=Don’t know if you’ve heard, but there’s a bunch of ships over at <EM4>~mission(Location|Address)</EM4> surrounding a burnt-out ship. You curious why? I know we are.\nThink you can get in that wreck, grab the blackbox, and get out? We’ll pay you for it.\n\nBased on the number of sketchy ships in the area, you should bring some friends with to watch your ass, unless you’re some crazy solo act, but we’d prefer if you actually survived this so you can drop off the blackbox at <EM4>~mission(Destination|Address)</EM4> for us. \n\nBut hey, your call. As long as it gets done.\n\n-Bit Zeros
BitZeros_blackbox_Intro_Desc_001=Who we are and what we do is not important. All you gotta know is that we need things to get done and we pay people to do it.\n\nIf everything goes well, we don’t ever have to meet. Doesn’t that sound good?\n\nGot a good one to start you off, nice and simple. There’s a blackbox from a downed ship at <EM4>~mission(Location|Address)</EM4> that we want.\n\nAll you have to do is take it to <EM4>~mission(Destination|Address)</EM4> and you get paid. Easy right? Watch out for scavs, you never know what kind of weirdos are hanging around these abandoned ships.\n\n-Bit Zeros
BitZeros_blackbox_M_Desc_001=We were a little too smart with this one and it’s kinda backfired. Sometimes you gotta dream big, you know? Anyway. we were looking to move some encrypted data to one of our data havens and decided to hide it in a ship’s blackbox. They filled the ship with “valuable” stuff as a decoy in case it got attacked. The plan worked a little too well and the cargo might have attracted the wrong kind of attention. They stole all the cargo but missed the blackbox. Bad news is the ship is now swarming with outlaws.\n\nThe data on that blackbox is useless to them, but we need it. If you can get it back for us, we can give you a nice cut from what we make. Seems like a fair deal, right?\n\nHead to <EM4>~mission(Location|Address)</EM4> and after you’ve done your thing take the flight recorder to <EM4>~mission(Destination|Address)</EM4>.\n\n-Bit Zeros
BitZeros_blackbox_S_Desc_001=Got a big job for a big player. We’re in the process of making someone disappear, like completely vanish, and a part of that is recovering the blackbox from the “accident” that they had recently over at <EM4>~mission(Location|Address)</EM4>.\nOnly problem is, seems the people this person hired to stage the accident have gotten it in their heads that there’s more money to be made. So much so that they’re still keeping tabs on the now deceased’s ship.\nThese guys aren’t playing around either. You’ll need a couple of friends to help you do this. But if you can get the blackbox out of there and into our hands by dropping it at <EM4>~mission(Destination|Address)</EM4>, we can really make it worth your while.\n\n-Bit Zeros
BitZeros_blackbox_VE_Desc_001=Someone of interest to us recently kicked the bucket (not our fault) over at <EM4>~mission(Location|Address)</EM4> and we’re pretty curious what happened. We need you to grab the blackbox from the ship and drop it off at <EM4>~mission(Destination|Address)</EM4>.\n\nThis is a shipwreck by the way, so chances are some scavs will be around there too. But don’t worry, that’s been factored into your pay too.\n\n-Bit Zeros
BitZeros_blackbox_VH_Desc_001=I’m not gonna give you the whole backstory of what this person has done to us, but all you need to know is that some scumbag is trying to get a payout for a ship crash and the insurance company wants to see the blackbox recording to make sure everything is “above board”.\n\nWe’re not gonna let that happen though.\n\nSnatch that blackbox at <EM4>~mission(Location|Address)</EM4> and bring it to us instead so we can do some “creative editing” on the recording.\n\nApparently, this area is a bit of a hot zone. Probably why they staged the accident there. You should probably bring some backup so you don’t get ghosted before you can bring the blackbox to us at <EM4>~mission(Destination|Address)</EM4>.\n\n-Bit Zeros
CFPvsHH_Reward_Week1_HH=You've Earned: Headhunter Veritas Outift\nAccess It at Your Primary Residence's Inventory
CleanAir_Defense-Milestone1_desc=Since you've been doing so much work helping out the Defense Division I wanted to come to you with this contract direct. It's a bit of a delicate one. Two VIPs fell ill and the worry was that if word got out they were being transported they would become major targets.\n\nUnfortunately, it seems that's exactly what happened. Our attempts to smuggle them from Nyx to Stanton for medical treatment have failed, and now the ship carrying them is under attack. \n\nWe need you to hurry to <EM4>~mission(Location|Address)</EM4>, neutralize the attackers and ensure that the cryopods make it safely to the freight elevator at <EM4>~mission(Location|Address)</EM4>. \n\nIn fact, I want you to make sure you have a ship that can carry the cryopods just in case their original transport is too damaged to go on.\n\nI sincerely hope you manage to pull this rescue mission off. \n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity
CleanAir_RecoverCargo_Easy_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Cargo Retrieval \nAPPROVAL CODE = JJ-11\n\nFOR IMMEDIATE PROCESSING\n\nWith all these Alliance Aid ships hauling valuable cargo around, outlaws in the area have gone into a feeding frenzy. We just got word of one of their latest targets via emergency beacon and need you to go over to <EM4>~mission(Location|Address)</EM4>, assess the situation, <EM4>neutralize any remaining hostiles</EM4> in the area, and if needed, secure the shipment for delivery to <EM4>~mission(Destination|Address)</EM4>.\n\nBe sure to bring a <EM4>handheld tractor beam</EM4> to handle the cargo. \n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.
CleanAir_RecoverCargo_Hard_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Cargo Retrieval \nAPPROVAL CODE = JJ-13\n\nFOR IMMEDIATE PROCESSING\n\nAlliance Aid just comm'd in a panic. A vital shipment that they were counting on hasn't shown up. All signs point to it getting jacked by thieves along the way so they're counting on us to make sure it gets delivered.  \n\nYou're going to head to <EM4>~mission(Location|Address)</EM4>, assess the situation, <EM4>neutralize any remaining hostiles</EM4> in the area, and  secure the shipment for drop off at <EM4>~mission(Destination|Address)</EM4>. Be sure to have a <EM4>few support ships</EM4> with you just in case things get extra rough. \n\nBe sure to bring a <EM4>handheld tractor beam</EM4> to handle the cargo.  \n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.
CleanAir_RecoverCargo_Medium_desc=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Cargo Retrieval \nAPPROVAL CODE = JJ-12\n\nFOR IMMEDIATE PROCESSING\n\nNothing like an emergency to bring out the worst in people. This Molina mold is killing people left and right, and what do the scum of this system decide to do? That's right, they're out there trying to highjack vital shipments. Alliance Aid wants us to make sure they don't get away with it. \n\nYou're going to head to <EM4>~mission(Location|Address)</EM4>, assess the situation, <EM4>neutralize any remaining hostiles</EM4> in the area, and secure the shipment for delivery to <EM4>~mission(Destination|Address)</EM4>. I expect these jackers to put up a good fight, so feel free to take along some backup if you want.\n\nBe sure to bring a <EM4>handheld tractor beam</EM4> to handle the cargo.  \n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.
Covalex_HaulCargo_AToB_Intro_desc=Earning such accolades as 'Imperial Finances' Top 10 Shipping Companies' and 'Delivery Digest's 2945's Most Trusted Transport,' Covalex is busier than ever. And that means more cargo going to more places. That's where you come in.  \n\nCovalex is looking for dependable and industrious pilots to join our expanding family. Do you have access to a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>? Can you pass an Advocacy background check if required? Then a universe of opportunity is waiting for you. \n\nSimply complete an 'Evaluation Trial’ by picking up a shipment of <EM4>~mission(Item)</EM4> from a freight elevator at <EM4>~mission(Location|Address)</EM4> and successfully delivering it to a freight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nUpon satisfactory completion, you'll be eligible to become part of Covalex Shipping's vast network of independent transport specialists*.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n*Covalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AToB_Rehire_desc=Hey,\n\nHave a bit of good news for you. Covalex recently finished an evaluation of our contractor pool, and decided to reconsider your status as a cargo hauler. To requalify, all you need is to successfully complete the following delivery.\n\nPick up <EM4>~mission(Item)</EM4> from a freight elevator at <EM4>~mission(Location|Address)</EM4> and deliver it to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. In order to complete this haul in a fast and efficient manner, you'll need a ship that can haul <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.\n\nHopefully everything goes smoothly so we can welcome you back to the team.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AToB_Scrap=Hello,\n\nThere’s some junk waiting at a freight elevator in <EM4>~mission(Location|Address)</EM4> that needs to go to a freight elevator at <EM4>~mission(Destination|Address)</EM4> for processing. I've confirmed that the containers won't be bigger than <EM4>~mission(MissionMaxSCUSize)</EM4>. \n\nMy mom would’ve loved this run. She’s one of those who thinks every scrapyard is filled with hidden treasures. Can’t even tell you how many hours I spent bored out of my mind following her around one. If that’s your thing, here’s a chance to actually make credits going to one.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n \n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AToB_Stanton_Interstellar=Hey,\n\nAny interest in doing the Stanton leg of an interstellar run? \n\nThere’s a haul of <EM4>~mission(Item)</EM4> waiting in containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller to be picked up from a freight elevator at <EM4>~mission(Location|Address)</EM4> and delivered to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. No need to take it any further than that. I’ve got someone else lined up to run it through the jump to its final destination. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AToB_desc_01=Hello,\n\nNeed a contractor for a simple cargo haul going from a freight elevator at <EM4>~mission(Location|Address)</EM4> to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. At most the containers will be <EM4>~mission(MissionMaxSCUSize)</EM4> in size. \n\nAlso, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along. \n\nAny chance you’re available to take care of it for us?\n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AToB_desc_02=Hi,\n\nA freight elevator at <EM4>~mission(Location|Address)</EM4> has some cargo that needs to be delivered to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. Another hauler backed out at the last minute because their ship couldn't handle <EM4>~mission(MissionMaxSCUSize) containers</EM4>, so you’d be doing me a big favor if you could take care of it.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AToB_desc_03=Hi,\n\nA new haul just popped up. Details are below, if you’re interested.\n\n1. Pick up cargo from a freight elevator at <EM4>~mission(Location|Address)</EM4>. Max size will be <EM4>~mission(MissionMaxSCUSize)</EM4>. \n2. Deliver to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.    \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AToB_title=~mission(ReputationRank) Rank - Direct ~mission(CargoRouteToken) ~mission(CargoGradeToken) Cargo Haul
Covalex_HaulCargo_AtoB_desc_ProcessedFood_Stanton2=Hi, \n\nLooks like Orison needs another resupply of processed food and pressurized ice. They have this stuff on a standard delivery schedule but they just requested a shipment as soon as possible.  \n\nAre you available to make the run? The stuff (<EM4>~mission(MissionMaxSCUSize) containers</EM4> or smaller) is waiting to be picked up from a freight elevator at <EM4>~mission(Location|Address)</EM4>. Should be a quick and easy run for you to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AtoB_desc_RawOre_Stanton1=Hey,\n\nA Hurston logistics manager just requested priority pick up from their facility. Sounds like they struck a new vein of ore and need to make room for what they're extracting.\n\nThe raw ore needs to be moved from a freight elevator at <EM4>~mission(Location|Address)</EM4> to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. Will be containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller. Sound like something you could handle? \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AtoB_desc_RefinedOre_Stanton4=Hi, \n\n<EM4>~mission(Destination|Address)</EM4> needs a delivery of refined ore to keep their production lines humming. The cargo (<EM4>~mission(MissionMaxSCUSize) containers</EM4> or smaller) is ready and waiting for pick up from a freight elevator at <EM4>~mission(Location|address)</EM4>. Any chance you’re available to collect and deliver it to a freight elevator at ~mission(Destination)?\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_AtoB_desc_ScrapWaste_Stanton3=Hey, \n\nThere's a bunch of scrap and waste waiting at a freight elevator at <EM4>~mission(Location|Address)</EM4> that needs to go to a freight elevator at <EM4>~mission(Destination|Address)</EM4> for sorting. I know ArcCorp started an initiative to reduce waste and recycle more scrap on planet, but I haven’t seen any decrease in these types of hauls from them yet.\n\nAre you available to move this batch of assorted junk (<EM4>~mission(MissionMaxSCUSize) containers</EM4> or smaller) off-world for them? \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_LinearChain_desc_01=Hi,\n\nOur data technicians strung a few runs together so you can pick up a new batch of cargo as you’re dropping some off which should make the run a lot more efficient. Have it arranged so you won't have deal with any containers larger than <EM4>~mission(MissionMaxSCUSize)</EM4>. Here’s what the itinerary looks like: \n\n~mission(LinearChainToken)\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_LinearChain_desc_02=Hello,\n\nLooks like the stars aligned perfectly for this run. There’s new cargo (<EM4>~mission(MissionMaxSCUSize)</EM4> or smaller) to pick up from each location where you're making a drop. Here are the details if you’re interested.  \n\n~mission(LinearChainToken)\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_LinearChain_desc_03=Hey,\n\nOur data technicians really outdid themselves with the efficiency of this cargo run. Each drop off location has more cargo waiting to be picked up. And conveniently, there won't be any containers bigger than <EM4>~mission(MissionMaxSCUSize)</EM4>.  \n\n~mission(LinearChainToken)\n\nIf you’re interested, best to grab this run before someone else does. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_LinearChain_title=~mission(ReputationRank) Rank  - ~mission(CargoRouteToken) ~mission(CargoGradeToken) Cargo Haul
Covalex_HaulCargo_MultiToSingle_Waste_Waste_Stanton1=Hi,\n\nNeed the trash collected from a few Hurston locations and then taken to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. Don't worry, none of the containers are bigger than <EM4>~mission(MissionMaxSCUSize)</EM4>.\n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nFun fact for you. Hurston is the only planet in Stanton that doesn’t separate their trash and scrap. One of their workers told me that the company did a cost-benefit analysis on it decades ago that determined it wasn’t worth putting a planet-wide system in place to facilitate it. Isn’t that the most Hurston thing ever?   \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_MultiToSingle_desc_01=Hello!\n\nThere’s a load of cargo (<EM4>~mission(MissionMaxSCUSize)</EM4> or smaller) that needs to be delivered to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. The only thing is that the cargo is spread across a few locations, which I’ve listed out below.  \n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nMakes no difference what order you grab the stuff, as long as it’s all delivered.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_MultiToSingle_desc_02=Hey,\n\nHere’s an interesting one. <EM4>~mission(Destination|Address)</EM4> is expecting a few shipments (max container size of <EM4>~mission(MissionMaxSCUSize)</EM4>) so the data technicians bundled all the pick ups together. Here’s a list of the stops: \n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nFeel free to do them in whatever order you want. Only thing that’s important is that all of them get delivered to a freight elevator at ~mission(Destination).\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_MultiToSingle_desc_03=Hi there,\n\nI’m in a bind and hoping you can help. A trusted hauler signed up for a run that needs to be delivered ASAP, but their ship junked out right when they were about to launch so I need someone to take over this run right away.\n\nIt's all cargo <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller that needs to go to a freight elevator at <EM4>~mission(Destination|Address)</EM4> after being collected from a few locations, which I’ve listed below:\n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nThe delay has already caused issues at some of the pick up locations. They really need that cargo gone to free up space for new deliveries. Any chance you can collect everything above and deliver it as quick as possible?\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_MultiToSingle_desc_RawOre_Stanton1=Hi,\n\nHurston is requesting that we prioritize pick ups from the local mining facilities to free up space for what they’re extracting. Here’s everywhere you need to go:  \n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nOnce collected, everything needs to get to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. They've said that all the containers will be at most <EM4>~mission(MissionMaxSCUSize)</EM4> in size. Sound like something you could handle? \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_MultiToSingle_desc_ScrapWaste_Stanton3=Hi there,\n\nThere’s a few sites on ArcCorp that need their waste and scrap collected (all boxes <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller) and taken to a freight elevator at <EM4>~mission(Destination|Address)</EM4>. Doesn’t matter what order you do the run, as long as you grab it all.    \n\nPICK UP LOCATIONS (ANY ORDER)\n\n~mission(MultiToSingleToken)\n\nYou know, my mom was a hauler who specialized in runs like this. It might not be the most glamorous stuff, but she claimed these runs had the best pay-to-risk ratio. Pirates never gave her any trouble when they found out what was on board.  \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
