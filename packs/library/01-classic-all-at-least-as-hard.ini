DeadSaints_RecoverCargo_Medium_Description=You got a ship and <EM4>a heavy-duty tractor beam</EM4>? Good. I’ve got work for you.\n\nDon’t know how they knew we were coming, but one of my haulers got jumped over at <EM4>~mission(Location|Address)</EM4>. The pilot’s gone silent so I assume they’ve been ghosted, but the cargo tracker is stationery for now.\n\nExpect the bastards who took out my pilot to still be around, so bring backup. Get the cargo and get out, don’t need to risk anymore good haulers on this mess.\n\nGet the goods to the freight elevator to <EM4>~mission(Destination|Address)</EM4> and I’ll send your payment.\n\n-Twitch
