HeadHunters_RecoverCargo_Hard_Description=Looking for a hauler to pick up some cargo for me. Thing is, there’s a catch.\n\nThe cargo’s in the back of an abandoned ship located at <EM4>~mission(Location|Address)</EM4>. As you may have figured, this ain’t our cargo, but it sure as hell doesn’t deserve to go to anyone else. I’ll be damned if those CFP assholes get their hands on it before we do.\n\nBe lucky as hell if we were the first to know about this, but I’d wager there’s gonna be more ships swarming around there than flies on a kopian carcass. If you got some pals you can trust, bring them along and ghost those assholes. And don’t forget your <EM4>heavy-duty tractor beam</EM4> of course.\n\nYou manage to get that cargo and bring it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>, I can get you a nice cut of the sale.\n\nStows out.
Headhunters_SecurityPatrol_E_Desc_001=Headhunters have expanded into Stanton, but still need help getting a lay of the land. I’ve got a run to check spots we want scanned ready to go. \n\nThis one kicks off at the <EM4>location marker</EM4> on your HUD and will look at a few more locations after that, but I’ll update you as we clear them out. Not expecting you to run into any trouble but no guarantees. Trouble seems to follow us.\n\nGet this done and I'll toss the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4> as a thanks.\n\nStows out.
Headhunters_SecurityPatrol_H_Desc_001=I’ve noticed an uptick in attacks on Headhunter ships in certain parts of Stanton. Got an important resupply shipment that we can’t afford to lose, and need help determining what route to send it. I’ve strung together a few potential spots that I’d set up in if I was gonna hit ‘em. Any chance you could visit and clear out any lowlifes that may be hiding there? \n\nThe route starts at the <EM4>location marker</EM4> on your HUD. After you scan it and clear whatever’s there, I’ll send you to a few other areas that could work. I’ve been hearing people have been rolling through these spots, so would be smart to <EM4>bring a friend</EM4> to watch your back.\n\nYou make it to the end and I'll give the main contractor a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4> as thanks. \n\n- Stows
Headhunters_SecurityPatrol_M_Desc_001=The local Clip wants current intel on several regions around Stanton. Not sure what they’re looking for but I’m not about to ask. My job is to find someone willing to swing through and scan these locations. You available? \n\nAll you need to do is head to the <EM4>location marker</EM4> on your HUD, run a scan, and if it’s clear, move to the next spot. If you run into any issues, take care of it. \n\nAin’t sound too tough now does it? Plus, I'll give the main contractor a bonus <EM4>~mission(ScripAmount) Council Scrip</EM4> as thanks. \n\n\nStows out.
Headhunters_SecurityPatrol_S_Desc_001=Got some asshole’s trying to push us out of the system. You up for pushing back?\n\nSee, there are some folks who really don’t want us in Stanton, and have started sending out hunting parties of five to seven ships, often with a bigger gun ship, to places where we’re building up our presence. Time for us to show that we’re here to stay.  \n\nI’ve strung together a few spots starting at the <EM4>location marker</EM4> on your HUD where we’re seeing the most hostile encounters. Need you to visit each one and scan to see if we can bait them into a fight.\n\nKnow this is going to be a hard one, so don't be cocky and try to go it alone. If I were you, I'd bring at least <EM4>three friends</EM4> onboard for support. To make it worth your while, I'm promising a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4> to the main contractor that pulls it off. \n\n- Stows
Headhunters_SecurityPatrol_VE_Desc_001=Headhunters want some intel on what’s happening around Stanton. We’ve already set up some monitoring satellites, but nothing beats a good ol’ patrol. You up for it?\n\nIf so, get on over to the <EM4>location marker</EM4> on your HUD. Start by scanning that region and then we’ll guide you to a few more spots that we want info on. \n\nAnd if you needed some extra motivation, there's a bonus of <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor at the end of the job. \n\n- Stows
Hints_Refueling_Process=Target the client's ship with ~action(spaceship_targeting_advanced|v_target_cycle_in_view_reset) and send a docking request using ~action(spaceship_movement|v_toggle_docking_request). Be sure to align your fuel nozzle with the front of their ship.
Hints_Refueling_Welcome=Refueling\nFirst send a docking request to connect your fuel nozzle to the client. Then, once the client has confirmed the fuel purchase, open the desired fuel pod to begin refueling.  
Hockrow_BlackBox_space_E_Desc_001=Hockrow Agency \nCase File #BR83215\nLead Investigator: Arken Mallor\n\nCase Summary: \nClient hired the agency to look into the destruction of one of their ships near <EM4>~mission(Location|Address)</EM4>. They are claiming that the ship was destroyed by an ex-partner and need the blackbox to prove it.\n\nContract Investigator Actions:\nDispatch to <EM4>~mission(Location|Address)</EM4> and locate the derelict ship. Secure the area from any hostiles. Retrieve the blackbox and deliver it to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nWhoever destroyed the ship could still be in the area so be prepared for a fight, as such this has been flagged as a <EM4>combat mission</EM4>.\n
Hockrow_BlackBox_space_H_Desc_001=Hockrow Agency \nCase File #BR744152\nLead Investigator: Arken Mallor\n\nCase Summary: \nContract’s come through to look into a recent attack near <EM4>~mission(Location|Address)</EM4>. Client claims that they were ambushed by a serious outlaw pack and need the proof. An operative with <EM4>significant combat experience</EM4> is needed to fly to scene and retrieve blackbox.\n\nContract Investigator Actions:\nFind site of derelict ship at <EM4>~mission(Location|Address)</EM4>, secure the blackbox, and deliver to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nExpect heavy resistance from outlaws present on the scene. As such, this has been flagged as a <EM4>combat mission</EM4>.
Hockrow_BlackBox_space_Intro_Desc_001=Hockrow Agency \nCase File #BRI1652\nLead Investigator: Arken Mallor\n\nCase Summary: \nHockrow Agency is currently looking for new contractors to aid in our investigations around the ’verse. A common staple in the quick resolution of a crime, the retrieval of a ship’s <EM4>blackbox</EM4> can provide critical insight into building a successful case. \n\nIf you’re eager to work with Hockrow, we want to offer a cut-and-dry blackbox retrieval op to see how it fits. \n\nI suspect that the perpetrators are long gone by now, so you shouldn't run into any resistance.\n\nContract Investigator Actions:\nHead out to <EM4>~mission(Location|Address)</EM4>, secure the black box in the derelict spaceship there and return it to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nSuccessful completion of this task will open up other employment opportunities within Hockrow Agency.
Hockrow_BlackBox_space_M_Desc_001=Hockrow Agency \nCase File #BR74382\nLead Investigator: Arken Mallor\n\nCase Summary: \nA known outlaw attacked and destroyed a ship near <EM4>~mission(Location|Address)</EM4>. The agency has been contracted to retrieve the ship’s blackbox in order to build a case against them and lobby for Advocacy intervention. \n\nContract Investigator Actions:\nAn operative is needed to head to the crime scene at <EM4>~mission(Location|Address)</EM4>, secure the area from any hostiles present to procure the blackbox, and deliver to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nBe advised that there are still <EM4>hostile forces in the area</EM4> that will attack. These will most likely have some experience fighting, so be prepared. \n\nThis contract has been flagged as a <EM4>combat mission</EM4>.
Hockrow_BlackBox_space_S_Desc_001=Hockrow Agency \nCase File #BR547384\nLead Investigator: Arken Mallor\n\nCase Summary: \nThis request comes down from Head Office. \n\nWe’ve just learned that a recent ship attack near <EM4>~mission(Location|Address)</EM4> might have been the work of a notorious and equally elusive outlaw ringleader. The last time they popped their head above water was years ago, so this is a rare opportunity to catch them. This is an opportunity that our client does not want to pass up. We need a <EM4>top-tier operative</EM4> with elite combat experience to retrieve the blackbox of this downed ship in order to prove the ringleader’s involvement.\n\n<EM4>There will be highly-trained hostiles present on the scene</EM4> who will put up significant resistance to your presence. Eliminate them and complete the mission.\n\n\nContract Investigator Actions:\nImmediately scramble to <EM4>~mission(Location|Address)</EM4> and clear the surrounding airspace in order to secure the blackbox. Once obtained, deliver it to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nHead Office stresses that this will be an incredibly difficult mission to pull off. Make sure you bring your A-game.
Hockrow_BlackBox_space_VE_Desc_001=Hockrow Agency \nCase File #BR56263\nLead Investigator: Arken Mallor\n\nCase Summary: \nNeed an operative to extract the blackbox from a destroyed ship. The ship’s owner claims that it was genuinely lost in an outlaw attack, but the insurance company has doubts. We’ve been hired to find out which is true.\n\nI suspect that the perpetrators are long gone by now, so you shouldn't run into any resistance.\n\nContract Investigator Actions:\nProceed to <EM4>~mission(Location|Address)</EM4>, secure the black box in the derelict spaceship there and return it to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>.\n\nAdditional Notes:\nYou will need to EVA for this one so make sure you got a suit.
Hockrow_BlackBox_space_VH_Desc_001=Hockrow Agency \nCase File #BR23665\nLead Investigator: Arken Mallor\n\nCase Summary: \nOperative with <EM4>extensive combat experience</EM4> needed to retrieve a <EM4>blackbox</EM4> from a compromised ship at <EM4>~mission(Location|Address)</EM4>. Client hasn’t specified why they need it but are paying good money to have it back. \n\nAnalysis of the wreck indicates that there are some serious hostiles in the area, so any attempt to retrieve will likely require a fight. Our records indicate that these hostiles are highly trained and aggressive, so prepare accordingly.\n\nContract Investigator Actions:\nRoute to <EM4>~mission(Location|Address)</EM4> and secure the blacbox by any means necessary. Once obtained, deliver it to <EM4>the freight elevator at ~mission(Destination|Address)</EM4> for payment.\n\nAdditional Notes:\nOperations wanted to reiterate that this will be a <EM4>heavy combat mission</EM4> so make sure you bring allies or equipment to handle it.
