outlaw_laser_datapad_006_text=To: Ali, Buccio, Doyle, Toru\nFrom: Toru\nSubject: RE: quick question\n\nGuys, can we stay focused maybe? Do you know how many credits we got riding here?\n\n- Mino\n\n-----\nTo: Ali, Doyle, Mino, Toru\nFrom: Toru\nSubject: RE: quick question\n\nActually, because the gravity is so low up here, it would never reach the moon’s atmosphere…\n\n- Buccio\n\n-----\nTo: Ali, Buccio, Doyle, Mino,\nFrom: Toru\nSubject: RE: quick question\n\nThe freezing would happen instantly. There wouldn’t be enough time for it to disintegrate.\n\n- Toru\n\n-----\nTo: Buccio, Doyle, Mino, Toru\nFrom: Ali\nSubject: RE: quick question\n\nNo way that would happen, its mass is too small.\n\n- Ali\n\n-----\nTo: Ali, Buccio, Doyle, Mino,\nFrom: Toru\nSubject: RE: quick question\n\nNo. It would freeze when entering the atmosphere, becoming an incredibly tough shard of ice, and then hit the ground. So yes: it could kill someone.\n\n- Toru\n\n-----\nTo: Buccio, Doyle, Mino, Toru\nFrom: Ali\nSubject: RE: quick question\n\nWouldn't it would burn up when it enters the moon’s atmosphere and disintegrate?\n\n- Ali\n\n-----\nTo: Ali, Buccio, Mino, Toru \nFrom: Doyle\nSubject: quick question\n\nDo you guys think if I threw one of my bullets off the OLP it would gather enough speed and force to kill someone?\n\n- Doyle
