Shubin_Industrial_ShipMining_S_Org_Desc_001=POSTING: Industrial\nLOCATION: ~mission(System)\nREQ EXPERIENCE: Ship Mining\n\nTERMS*: \n\nShubin Interstellar values the continuous and consistent deliveries of ore that you have provided and now wishes for you to push your performance further.\n\nWe are in need of a vast amount of ore, ranging from common to rare. A variety of different methods will need to be employed to gather these resources and most importantly, you will need a large organization of fellow contractors in order to achieve this. mineable from numerous locations across <EM4>~mission(System)</EM4>. Reward will be proportionate to the effort and scale of this contract.\n\nAs one of our most experienced contractors, we would expect you to know where to find these minerals by now, but should you need a reminder, consult <EM4>Mining Fundamentals #2: Where to Mine</EM4> in your mobiGlas Journal.\n\nAll Shubin Interstellar contractors are expected to provide their own equipment. For this contract you and your fellow contractors will need a <EM4>Multi-Tool with a Mining Attachment, a Ground Vehicle capable of mining, and a Ship capable of mining</EM4>.\n\nAs always, <EM4>the ore must be refined before it is submitted</EM4>. This can be done at any refinery, the location of which can be found in your starmap.\n\nOnce you have successfully gathered and refined the materials, deposit them in the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\nDISCLAIMER: As a part of our Employee Incentive Program, Shubin Interstellar is willing to award contractors by <EM4>allowing them to keep any surplus materials that they obtain from this contract</EM4>. This surplus can be sold at a local kiosk at the contractor's discretion.\n\n\n*Shubin Interstellar is an equal opportunity contractor. By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract.
