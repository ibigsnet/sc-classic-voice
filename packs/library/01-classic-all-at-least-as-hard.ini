item_Desc_qrt_specialist_medium_legs_01_03=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4.0 µSCU\n\nBlending durability and a striking style, the Artimex armor exemplifies the Quirinus aesthetic. This intricately detailed armor considers both form and function, especially when paired with the fully enclosed helmet that features a neon ocular flourish. The armor also comes with a unique cowl that fans over the helmet and a knee length fitted cape.\n\nThe Elysium edition combines bright gold detailings of winged skulls with a navy blue.
item_Desc_rsi_deckcrew_undersuit_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nRSI's Beacon undersuit is a general use utility designed to provide total protection against environments and vacuum. Built out of a durable but flexible polymers, the Beacon provides a wide freedom of motion for a variety of body types.
item_Desc_rsi_deckcrew_undersuit_01_ruso=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nRSI's Beacon undersuit is a general use utility designed to provide total protection against environments and vacuum. Built out of a durable but flexible polymers, the Beacon provides a wide freedom of motion for a variety of body types. The Rust Society edition celebrates blue-collar workers with an exclusive red and tan coloration that hides dirt and wear and tear well.  
item_Desc_rsi_explorer_light_core_01_01_coramor=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -38 / 68 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\nBackpacks: Light\n\nRobert Space Industries’ Venture Explorer Suit provides exceptional protection against the dangers of space. Designed for those who don't know where their next adventure might go, the suit combines comfort and safety without sacrificing mobility. This special Lovestruck edition features a stylish metallic pink and black color scheme inspired by the colors of the Coramor festival.
item_Desc_rsi_explorer_light_core_01_03_coramor=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -38 / 68 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\nBackpacks: Light\n\nRobert Space Industries’ Venture Explorer Suit provides exceptional protection against the dangers of space. Designed for those who don't know where their next adventure might go, the suit combines comfort and safety without sacrificing mobility. This special Starcrossed edition is modeled after the armor worn by Yuri Ilyin in the famous 25th century vid, Coramor, which inspired the eponymous lovers' festival.
item_Desc_rsi_explorer_light_core_01_iae2023_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -38 / 68 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\nBackpacks: Light\n\nRobert Space Industries’ Venture Explorer Suit provides exceptional protection against the dangers of space. Designed for those who don't know where their next adventure might go, the suit combines comfort and safety without sacrificing mobility. This special Envy edition inspired by the Coramor festival features a vibrant pink and purple color scheme for the most enthusiastic of lovers.
item_Desc_rsi_explorer_undersuit_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nWhether you’re discovering bold new frontiers or simply stretching your legs after a long spaceflight, Robert Space Industries’ Venture Explorer Suit takes vacuum-safe wear to the next level with its incorporation of top-of-class safety features seamlessly blended with phenomenal freedom of movement.
