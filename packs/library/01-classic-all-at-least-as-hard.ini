item_Desc_kap_combat_light_legs_02_02_01=Item Type: Light Armor\nDamage Reduction: 20%\nCarrying Capacity: 2.5k µSCU\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven info the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps.\n\nFeaturing a hooded shawl and a white digital camo pattern, the Snow Camo edition is perfect for stalking prey in frozen environments.
item_Desc_kap_combat_light_legs_03_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nCarrying Capacity: 2.5k µSCU\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven info the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps.\n\nThis matte black stealth armor is embellished with intricate golden flowers, giving your enemies one final glimpse of life before death.
item_Desc_kap_combat_light_legs_04_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven into the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps. \n\nThe Stronghold edition features the fierce symbology of the Nine Tails gang with bold neon pink accents. 
item_Desc_ksar_undersuit_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nThis baseline undersuit from Kastak Arms offers complete protection seal from the elements and compatibility with multiple armor types.
item_Desc_nvs_pilot_flightsuit_01=Item Type: Armored Flight Suit\nDamage Reduction: 20%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 8.0 µSCU\n\nInspired by the armored flight suit worn by UEE Navy pilots, the OMNI-AFS-Sapphire has been battle tested and refined for centuries to become the ultimate wear for any pilot. Its sturdy yet comfortable construction can not only withstand hostile environments, but comes with integrated arm, core, and leg armor for combat encounters. The only way a pilot can get closer to the real thing is by enlisting.
item_Desc_nvs_pilot_flightsuit_helmet_01=Item Type: Light Helmet\nDamage Reduction: 20%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nSimilar to the helmet worn by UEE Navy pilots, the OMNI-AFS-Sapphire helmet delivers excellent protection and visibility. Multilayered plating protects against impacts while its wide faceplate ensures clear, unobstructed views whether in the cockpit or on foot.
item_Desc_nvy_flightsuit_01_01_01=Item Type: Flight Suit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nInspired by the original flight suits worn by Earth's Air Force, this replica stays true to the historical design while incorporating modern comforts.\n\nThe Aviator edition is primarily green-beige with light green accents.
item_Desc_nvy_flightsuit_01_02_01=Item Type: Flight Suit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nInspired by the original flight suits worn by Earth's Air Force, this replica stays true to the historical design while incorporating modern comforts.\n\nThe Bombardier edition is primarily a stone color with dark brown accents.
item_Desc_nvy_flightsuit_helmet_01_01_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nInspired by the original flight suits worn by Earth's Air Force, this replica stays true to the historical design while incorporating modern comforts. Featuring a period appropriate, tinted half-visor, this helmet reproduction is not airtight.\n\nThe Aviator edition is primarily green-beige with light green accents.
item_Desc_nvy_flightsuit_helmet_01_02_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nInspired by the original flight suits worn by Earth's Air Force, this replica stays true to the historical design while incorporating modern comforts. Featuring a period appropriate, tinted half-visor, this helmet reproduction is not airtight.\n\nThe Bombardier edition is primarily a stone color with dark brown accents.
item_Desc_nvy_pilot_flightsuit=Item Type: Flight Suit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nThe Navy has spent centuries refining the flight suits that their combat pilots wear. The OMNI-CFS Diamond is the culmination of this long and battle-tested military. The Omni features reinforced construction to withstand a variety of hostile environments and integrates flawlessly with appropriately classic armor systems.
item_Desc_nvy_pilot_flightsuit_helmet_01_Shared=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe APOS helmet's carbon fibre shell offers superb impact and penetration protection, an uninterrupted field of view and excellent stability making it ideal for all kinds of operations in the field.
item_Desc_ops_pants_02_01_01=Carrying Capacity: 0.5K µSCU\n\nCut to a narrow fit, OpalSky's Mivaldi pants feature bold asymmetrical design with smart yet casual dual material styling, making it the perfect addition to any wardrobe.\n\nWomen's sizes currently out of stock.
item_Desc_orig_armor_medium_helmet_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -55 / 85 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nInspired by the sleek stylings of the 100 series, the Giocoso is a helmet worthy of Origin Jumpworks. It features a wide face shield to provide excellent peripheral vision and a special internal air flow system to dissipate heat and humidity. In a nod to the 100 series, the back of the helmet slyly integrates the iconic shape language of the ship's tail into the form.
item_Desc_orig_flightsuit_01_01_01=Item Type: Flight Suit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nEmbody luxury, style, and speed by stepping into this official flight suit worn by the Origin racing team. This gray and yellow flight suit features the Origin and 350r logo in several prominent places. 
item_Desc_orig_flightsuit_helmet_01_01_01=Item Type: Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nPlunge headlong into extreme speed in comfort and style with the Origin racing helmet. This gray and yellow helmet sports the Origin logo and features a wide visor for unobstructed views as you speed by.
item_Desc_outlaw_legacy_medium_armor=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -56 / 86 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nStrength and speed combine with the new Inquisitor armor set. Strong yet lightweight alloy plating works alongside reinforced polyfiber weaving to save your skin, but not slow you down. When combined with Kastak Arms' intimidating aesthetic, it's easy to see why this medium armor has become infamous across the Empire.	
item_Desc_qrt_mantis_undersuit_01_01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe Sabine embodies the advanced look and performance you expect from Quirinus Tech. This cutting edge undersuit integrates strong, yet flexible microweaves with strategically placed plating to provide protection while remaining lightweight. Featuring a sleek design, the Sabine undersuit will ensure you stay safe and stylish no matter the path ahead. 
item_Desc_qrt_mantis_undersuit_01_02_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe Sabine embodies the advanced look and performance you expect from Quirinus Tech. This cutting edge undersuit integrates strong, yet flexible microweaves with strategically placed plating to provide protection while remaining lightweight. Featuring a sleek design, the Sabine undersuit will ensure you stay safe and stylish no matter the path ahead. The Daybreaker edition features subtle yet striking gold highlights.
item_Desc_qrt_mantis_undersuit_01_03_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe Sabine embodies the advanced look and performance you expect from Quirinus Tech. This cutting edge undersuit integrates strong, yet flexible microweaves with strategically placed plating to provide protection while remaining lightweight. Featuring a sleek design, the Sabine undersuit will ensure you stay safe and stylish no matter the path ahead. \n\nThis special variant is adorned with a Year of the Rat symbol on the abdomen and features deep red and gleaming gold accents to help give your lunar new year an auspicious start.
item_Desc_qrt_mantis_undersuit_01_04_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe Sabine embodies the advanced look and performance you expect from Quirinus Tech. This cutting edge undersuit integrates strong, yet flexible microweaves with strategically placed plating to provide protection while remaining lightweight. Featuring a sleek design, the Sabine undersuit will ensure you stay safe and stylish no matter the path ahead. \n\nThis special Red Festival variant features deep red and gleaming gold accents to help give your lunar new year an auspicious start.
item_Desc_qrt_mantis_undersuit_helmet_01_01_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nGet a clear view of everything around you with the Calva helmet from Quirinus Tech. The large face shield made from proprietary synthetic sapphire provides scratch resistance while remaining just as thin and light as typical materials.
