Covalex_HaulCargo_RoundDelivery_desc_01=Hey,\n\nBased on feedback from some haulers, our data technicians have started organizing cargo runs that end with a drop off at the initial pick up site. Plus, they've made sure to cap the container size at <EM4>~mission(MissionMaxSCUSize)</EM4>. Got one here if you’re interested.   \n\n~mission(RoundDeliveryToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_RoundDelivery_desc_02=Hey there,\n\nGot a good run here. The itinerary includes a few stops with the last delivery bringing you back to where you do the first pick up. And there shouldn't be anything bigger than <EM4>~mission(MissionMaxSCUSize)</EM4> that you'lll need to deal with.\n\nHere are the specifics:    \n\n~mission(RoundDeliveryToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_RoundDelivery_desc_03=Hi,\n\nAny chance you’re free? The hauler who usually handles this circuit is out sick. Nice thing about this run is that it ends at the same place it starts and there won't be any containers bigger than <EM4>~mission(MissionMaxSCUSize)</EM4>. \n\n~mission(RoundDeliveryToken) \n\nLet me know if you can knock this out. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
