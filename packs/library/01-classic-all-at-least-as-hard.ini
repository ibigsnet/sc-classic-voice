RedWind_HaulCargo_desc_intro=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nRed Wind is looking to bolster our roster of haulers in Pyro. It takes a special pilot to want to do runs in a system as unpredictable as this one. Need someone who can keep their wits about them and keep quiet. If you check those boxes, and have a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>, then give this trial run a shot.  \n\nPICK UP\nFreight elevator at <EM4>~mission(Location|Address)</EM4>. \n\nDROP OFF\nFreight elevator at <EM4>~mission(Destination|Address)</EM4>.\n\nComplete this contract and we’ll send more hauling opportunities your way. And don't forget to pack a <EM4>handheld tractor beam</EM4> to bring along. \n
RedWind_RecoverCargo_Super_Description=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nWe have a special assignment for only the most competent contractors. One of our haulers who is sadly no longer with us failed to complete their last job. The cargo they were supposed to deliver is sitting stationery in their former ship in the location listed below.\n\nRECOVERY LOCATION\n     · <EM4>~mission(Location|Address)</EM4>\n\nDROP OFF LOCATION\n     · Freight elevator at <EM4>~mission(Destination|Address)</EM4>\n\nI’m not going dance around the issue, this is an extremely challenging job. You’ll need to bring a strong team of skilled pilots with you to deal with the outlaws that killed the previous contractor and a <EM4>heavy-duty tractor beam</EM4> to retrieve the client’s cargo. That said, if you take on this contract, we will make it worth your time.\n\nHOW DID WE DO – Complete our short feedback survey on our Spectrum page for a chance to enter our monthly prize draw.
RedWind_RecoverItem_E_Desc_001=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nSeems a pilot of ours ran into some trouble and left a client’s delivery unfulfilled. We suspect they may no longer be with us, but it’s important that we continue to offer outstanding levels of service and complete the job. If you accept, please head to <EM4>~mission(Location|Address)</EM4> to pick up the packages. Be advised you may encounter some <EM4>opportunistic outlaws</EM4> near the derelict ship.\n\nPACKAGES TO RECOVER\n     · <EM4>2x ~mission(Item1)</EM4>\n\nDROP OFF LOCATION\n     · Deliver to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>\n\n\nTAKE PRIDE IN YOUR WORK – Even as a contractor you are representing Red Wind Linehaul. Do not intentionally do anything to harm the company’s reputation.
RedWind_RecoverItem_H_Desc_001=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nNeed an experienced pilot for this recovery contract. Unfortunately, the original delivery pilot was targeting by a group of outlaws. Thankfully, the client’s packages are still sitting in their damaged ship located at <EM4>~mission(Location|Address)</EM4>.\n\nYou’ll potentially need to <EM4>bring some backup</EM4> with you to ensure the successful collection and delivery of the packages.\n\nPACKAGES TO RECOVER\n     · <EM4>4x ~mission(Item1)</EM4>\n\nDROP OFF LOCATION\n     · Deliver to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>\n\nConsidering the danger of this contract, we’re willing to offer a slight pay increase as hazard pay.\n\nTAKE PRIDE IN YOUR WORK – Even as a contractor you are representing Red Wind Linehaul. Do not intentionally do anything to harm the company’s reputation.
RedWind_RecoverItem_Intro_Desc_001=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nRed Wind is excited to announce that we are looking to hire new couriers to help with deliveries across the ’verse. We pride ourselves on been a flexible company that’s eager to meet the needs of all clients, everywhere. We’ll ask no questions; if you want it there, we’ll get it there. If that sounds like you, we have an introductory contract to see if you’re the right fit.\n\nWe need a resilient new hire to head to <EM4>~mission(Location|Address)</EM4>, recover the package abandoned by a former employee, and finish the delivery.\n\nPACKAGES TO RECOVER\n     · <EM4>1x ~mission(Item1)</EM4>\n\nDROP OFF LOCATION\n     · Deliver to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>\n\nIf you’re able to handle this contract we’d be delighted to send you more courier opportunities.\n\nTAKE PRIDE IN YOUR WORK – Even as a contractor you are representing Red Wind Linehaul. Do not intentionally do anything to harm the company’s reputation.
RedWind_RecoverItem_M_Desc_001=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nOutlaws are making our jobs much harder to complete these days. We need a contractor with combat experience to head to our former delivery pilot’s ship location at <EM4>~mission(Location|Address)</EM4> and recover the packages left there.\n\nPACKAGES TO RECOVER\n     · <EM4>3x ~mission(Item1)</EM4>\n\nDROP OFF LOCATION\n     · Deliver to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>\n\nWhile you're out there, be on the lookout for trouble, we’re getting <EM4>reports of multiple outlaws</EM4> in the vicinity.\n\nTAKE PRIDE IN YOUR WORK – Even as a contractor you are representing Red Wind Linehaul. Do not intentionally do anything to harm the company’s reputation.
RedWind_RecoverItem_VE_Desc_001=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nA contractor of ours has run into some trouble and abandoned their ship over at <EM4>~mission(Location|Address)</EM4>. We need someone to head to their ship, pick up the package they left there, and finish the job.\n\nPACKAGES TO RECOVER\n     · <EM4>1x ~mission(Item1)</EM4>\n\nDROP OFF LOCATION\n     · Deliver to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>\n\nWe’re currently uncertain as to why they failed to complete the contract, so be cautious when approaching the ship.\n\nTAKE PRIDE IN YOUR WORK – Even as a contractor you are representing Red Wind Linehaul. Do not intentionally do anything to harm the company’s reputation.
RedWind_RecoverItem_VH_Desc_001=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nWe appreciate how hard you’ve been working for us recently, which is why we’d like to offer you this advanced contract. An important client of ours is waiting for delivery on multiple packages but the courier due to deliver them is no longer responding. The package trackers are showing that they’re at <EM4>~mission(Location|Address)</EM4>, meaning we have some time to recover the delivery.\n\nPACKAGES TO RECOVER\n     · <EM4>5x ~mission(Item1)</EM4>\n\nDROP OFF LOCATION\n     · Deliver to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>\n\nWe cannot stress enough how important the success of this delivery is. Since we do not know what happened to the original courier, we strongly urge you to travel with <EM4>several trustworthy combat pilots.</EM4>\n\nNeedless to say, we’re offering a substantial payout for this one proportionate to the danger of the contract.\n\nTAKE PRIDE IN YOUR WORK – Even as a contractor you are representing Red Wind Linehaul. Do not intentionally do anything to harm the company’s reputation.
