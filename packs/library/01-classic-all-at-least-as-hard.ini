item_Desc_syfb_flightsuit_helmet_01_iae2023_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nAdapted by Syang Fabrication to meet the unique requirements of the Human physique, the Xanthule helmet faithfully recreates the bold silhouette preferred by Xi'an. When paired with the Xanthule suit, it creates a distinct and eye-catching look. This special IAE 2953 edition is decorated with a copper and white pattern inspired by Gatac Manufacture's Syulen.
item_Desc_syfb_flightsuit_suit_01_01_01=Item Type: Flight Suit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 6.5 µSCU\nBackpacks: Light\n\nPerfected through centuries of innovation, Syang Fabrication's sleek and stylish Xanthule flight suit has been meticulously adapted to the Human physique. The Xanthule suit features breathable lightweight plating made with a carbon-silk weave that provides reliable protection while maintaining the famed House's signature aesthetic.
item_Desc_syfb_flightsuit_suit_01_01_02=Item Type: Flight Suit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 6.5 µSCU\nBackpacks: Light\n\nPerfected through centuries of innovation, Syang Fabrication's sleek and stylish Xanthule flight suit has been meticulously adapted to the Human physique. The Xanthule suit features breathable lightweight plating made with a carbon-silk weave that provides reliable protection while maintaining the famed House's signature aesthetic.
