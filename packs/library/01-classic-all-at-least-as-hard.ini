civilian_localdelivery_holiday_desc_002=I'm in desperate need of a little Luminalia magic and I hope you're the one to help.\n\nThere are three gifts stuck at <EM4>~mission(Pickup1|Address)</EM4> that need to be delivered. \n\nI tried scheduling a pick up but just got notified that they won't be able to make it until after the holidays. Would you be able to take care of the deliveries for me? I'll gladly pay you what I was going to give them.\n\nIt shouldn't be too hard. One is for ~mission(GiftRecipient1) over at <EM4>~mission(DropOff1)</EM4>, another's for ~mission(GiftRecipient2) at <EM4>~mission(DropOff2)</EM4>, and the last one is for ~mission(GiftRecipient3) who's at <EM4>~mission(DropOff3)</EM4>.\n\nWhatever you decide to help or not, I hope you have a very happy holiday!\n\n- ~mission(GiftSender)
civilian_localdelivery_holiday_desc_003=Hope the holiday season is treating you well.\n\nMine's been a bit stressful so far. It turns out that I put the wrong delivery address on a handful of gifts and I'm desperately seeking a way to get them delivered on time. \n\nIt would mean so much to me if you could get me out of this jam. \n\nThe presents are at <EM4>~mission(Pickup1|Address)</EM4> and will need to be delivered to: \n- ~mission(GiftRecipient1) at <EM4>~mission(DropOff1)</EM4>.\n- ~mission(GiftRecipient2) at <EM4>~mission(DropOff2)</EM4>.\n- ~mission(GiftRecipient3) at <EM4>~mission(DropOff3)</EM4>.\n\nThank you and best holiday wishes,\n~mission(GiftSender)
civilian_localdelivery_holiday_desc_004=I know things get busy around the holidays, but I was reaching out to see if you had any extra time to do a delivery run.\n\nGot a few presents at <EM4>~mission(Pickup1|Address)</EM4> for close friends that I won't be able to deliver myself. \nYou would need to take one to ~mission(GiftRecipient1) at <EM4>~mission(DropOff1)</EM4>, another to ~mission(GiftRecipient2) at <EM4>~mission(DropOff2)</EM4>, and the last to ~mission(GiftRecipient3) at <EM4>~mission(DropOff3)</EM4>.\n\nMuch appreciated,\n~mission(GiftSender)
crafting_machineName_fabricator_standard_AA=RediMake Item Fabricator AA Suport
deadsaints_recoveritem_E_Desc_001=Not sure how the hell this happened, but my pilot’s gone and got themselves killed over at <EM4>~mission(Location|Address)</EM4>. If you want to die on your own time, that’s your business, but they did it while carrying a stash for me. Now I gotta have someone go out there and finish their work.\n\nDrop the two packages off for me at <EM4>~mission(Destination|Address)</EM4> and I’ll have one of my crew collect it later. If you see those assholes who took out my pilot, give ‘em hell.\n\n-Twitch
deadsaints_recoveritem_H_Desc_001=Just got a comm from the pilot who was transporting some gear for me and it sounded like they got jumped while on the call. I need someone to head to their location, grab the four packages that are still left inside their ship and bring them back to me.\n\nBefore they cut out, they told me that the ships that attacked them weren’t your standard transporters. These assholes are rocking some serious weaponry. Bring a crew, get my shit, and take it to <EM4>~mission(Destination|Address)</EM4>. This whole thing is such a mess that I’d be willing to fork out some extra creds if you can get this done.\n\n-Twitch
deadsaints_recoveritem_Intro_Desc_001=Here’s the deal. Dead Saints need some new blood to help shift gear across the ’verse and if you can prove yourself useful, you could make some nice creds doing it.\n\nGot an easy one to start you out. Couple of hours ago, something went down over at <EM4>~mission(Location|Address)</EM4> and a pilot of mine got ghosted. My tracker’s telling me that they didn’t find the stash of gear in there.\n\nIf you can get out there, get the package back and drop it at <EM4>~mission(Destination|Address)</EM4> without dying, I might have some more work for you. Can’t see you running into too much trouble as any ships you spot will likely be scavs looking for a quick cred. I’m sure you can take care of that.\n\n-Twitch
deadsaints_recoveritem_M_Desc_001=A couple of hours ago I was supposed to receive a shipment of gear from a pilot of mine. I don’t like late, so I need you to head to their location and recover my stuff. I’ve got trackers on the packages so they should be easy enough to find.\n\nMy gut says the pilot’s been ghosted. They knew how to handle a ship well, so the scavs that took them out must be decent. When you get my three packages back, drop it off at <EM4>~mission(Destination|Address)</EM4> for me and I’ll wire you the creds.\n\n-Twitch
deadsaints_recoveritem_VE_Desc_001=Need someone solid to head to <EM4>~mission(Location|Address)</EM4> and finish a delivery for me. The last contractor got themselves perished and now my stash is sitting in the back of their ship.\n\nThe scavs that took out my pilot might be there too, so stay alert. Drop my package off at <EM4>~mission(Destination|Address)</EM4> and I’ll pay you for your time.\n\n-Twitch
deadsaints_recoveritem_VH_Desc_001=I got a situation I need dealing with pronto. A rival crew has intercepted a major shipment of gear I was expecting and all hell is breaking loose. The pilot’s ghosted, the ship’s busted, and it’s only a matter of time before they take my shit and leave. If you’re up for cracking these assholes, head to <EM4>~mission(Location|Address)</EM4> and get my five packages.\n\nHead’s up though, the pilot they ghosted was one of my best, so this crew’s got to be seriously kitted out. Bring your finest mates with you and show the bastards no mercy. Understood?\n\nWhen you’re done, drop the gear off at <EM4>~mission(Destination|Address)</EM4> and I’ll make sure you get a serious cut of the takings.\n\n-Twitch
