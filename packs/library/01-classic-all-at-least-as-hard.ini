Covalex_HaulCargo_SingleToMulti_Processed_Mixed_QTFuelHydroFuelShipAmmo=Hey,\n\nThe folks at <EM4>~mission(Location|Address)</EM4> have what I like to call a “pilot’s special” waiting to be distributed - a haul of quantum fuel, hydrogen fuel, and ship ammo. Load it up from a freight elevator and deliver it to the following spots in whatever order works best for you. Expect the containers to all be <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller.   \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_SingleToMulti_Processed_Stims=Hi,\n\nThere’s a load of stims at <EM4>~mission(Location|Address)</EM4> ready to be picked up from a freight elevator and delivered to a few spots. They will be packaged up in containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller. Any chance you can knock this one out for me? \n\nDoesn’t matter what order you drop them off.    \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nGlad I never picked up the habit myself because I swear I get more delivery update requests for “where are my stims?!?” than any other kind of shipment. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_SingleToMulti_RefinedOre=Hi there,\n\nThe refinery at <EM4>~mission(Location|Address)</EM4> has been busy. They’ve processed a bunch of <EM4>~mission(Item)</EM4> into containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller, and are looking to get it shipped out from a freight elevator. I just checked with the LEOs to see which ones needed this stuff and was able to put together this run.  \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nShould be an easy run for you, if you’re free. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_SingleToMulti_desc_01=Greetings, \n\nSeems like <EM4>~mission(Location|Address)</EM4> currently has some <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller cargo that needs to be separated and delivered to a few different spots. \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nDrop-offs can be done in whatever order works best for you.  \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_SingleToMulti_desc_02=Hey, \n\nI’ve a multi-stop run here that needs to be done. Good news is that all of the cargo is <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller and can be picked up from a freight elevator at <EM4>~mission(Location|Address)</EM4>. The drop offs are spread across a few locations, but can be done in any order.     \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.    \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_SingleToMulti_desc_03=Hello, \n\nInterested in knocking out a few runs at once? \n\nThere’s a load of cargo (<EM4>~mission(MissionMaxSCUSize)</EM4> or smaller) waiting at a freight elevator in <EM4>~mission(Location|Address)</EM4> that needs to be delivered to the following spots:\n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nFeel free to route plan the drop-offs as you see fit.\n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_SingleToMulti_desc_ProcessedFood_Stanton2=Hi, \n\nThere’s a few Crusader facilities that need to be restocked with processed food and pressurized ice. Don’t know why but I’m always surprised when I see how much of this stuff they need delivered.\n\nAnyways, there’s a haul of containers no bigger than <EM4>~mission(MissionMaxSCUSize)</EM4> waiting at <EM4>~mission(Location|Address)</EM4>. Once you grab the goods from a freight elevator, these are the facilities where it needs to go:\n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_SingleToMulti_desc_RefinedOre_Mixed=Hey,\n\nThe refinery at <EM4>~mission(Location|Address)</EM4> has been busy. They’ve processed a mix of refined ores and are looking to get the containers (<EM4>~mission(MissionMaxSCUSize)</EM4> or smaller) shipped out from a freight elevator. I just checked with the LEOs to see where this stuff is needed and was able to put together this run.  \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken)\n\nShould be an easy run for you, if you’re free. \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
Covalex_HaulCargo_SingleToMulti_desc_RefinedOre_Stanton4=Hey there,\n\nThere’s some refined ore in containers <EM4>~mission(MissionMaxSCUSize)</EM4> or smaller that needs to be moved from a freight elevator at <EM4>~mission(Location|Address)</EM4> to production facilities on microTech. You can plan the drop offs anyway you want. Doesn’t matter what order they get done as long as they get there.  \n\nDROP OFF LOCATIONS (ANY ORDER)\n\n~mission(SingleToMultiToken) \n\nBy the way, we strongly encourage contractors to bring a <EM4>handheld tractor beam</EM4> along.   \n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Logistics Coordinator\nCovalex Shipping  \n'Anything you need, anywhere you need it.'\n\n\n\n\n\n\n\nCovalex Shipping is a limited liability corporation. To encourage timely deliveries and prevent fraud on cargo hauls, Covalex Shipping will set a delivery time limit and upon expiration, any undelivered cargo will be considered stolen and treated as such. If you need to abandon your delivery, Covalex will provide a new drop off location for you to return the cargo. Not doing so will affect your reputation with the company. Total payment will be prorated according to the percentage of cargo successfully delivered.
