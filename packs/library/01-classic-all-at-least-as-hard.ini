item_Desc_slaver_combat_medium_legs_01_02_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -60 / 90 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4.0 µSCU\n\nThe DustUp has your back if you’re looking to get into some trouble. The body plating is built off of the same CDS undersuit used by the UEE Marines, it adds reconstructed Omni-Role mkII pieces to give you solid protection against incoming fire. The whole thing’s been reasonably tested against vacuum too, so you can feel free to EVA all you want without worrying about dying.\n\nThe Ultimatum edition features the signature neon pink iconography of the Nine Tails gang.
item_Desc_slaver_undersuit_armor_01_01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nKastak Arms' Stoneskin is a combat undersuit that are built upon CDS' famous TCS-4 system based on extensive feedback from the operators who rely on this technology in the field. Offering a myriad of options for armor and EVA capabilities, the Stoneskin is set to rival CDS as a rugged and reliable undersuit.
item_Desc_srvl_combat_heavy_helmet_03_02_01=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -70 / 100 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nFavored by the most brutal of hunters, the Wrecker armor is a fusion of discarded metal and pilfered fabric cobbled together to offer protection while stalking prey.\n\nThe Payback version is sprayed with red paint and anointed with bone fragments and Vanduul armor pieces.
item_Desc_srvl_combat_heavy_helmet_03_03_01=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -70 / 100 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nFavored by the most brutal of hunters, the Wrecker armor is a fusion of discarded metal and pilfered fabric cobbled together to offer protection while stalking prey.\n\nThe Ashen version is sprayed with white paint and anointed with bone fragments and Vanduul armor pieces.
item_Desc_srvl_combat_medium_arms_01_03_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -50 / 80 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nForged from scavenged metals and ragged clothes, the Carrion armor is a crude concotion of repurposed materials that demonstrates you'll do anything it takes to survive.\n\nThe Ashen version is sprayed with white paint and anointed with bone fragments.
