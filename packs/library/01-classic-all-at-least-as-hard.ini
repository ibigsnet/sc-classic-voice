item_Desc_srvl_combat_medium_legs_01_02_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -50 / 80 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 8K µSCU\n\nForged from scavenged metals and ragged clothes, the Carrion armor is a crude concoction of repurposed materials that demonstrates you'll do anything it takes to survive.\n\nThe Payback version is sprayed with red paint and anointed with bone fragments.
item_Desc_srvl_combat_medium_legs_01_03_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -50 / 80 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 8K µSCU\n\nForged from scavenged metals and ragged clothes, the Carrion armor is a crude concoction of repurposed materials that demonstrates you'll do anything it takes to survive.\n\nThe Ashen version is sprayed with white paint and anointed with bone fragments.
item_Desc_srvl_heavy_armor_01_Shared=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -77 / 107 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nSome consider the Overlords heroes and other criminals. Doomsday doesn't care either way. All we know is that the vigilante group that made a name for itself targeting outlaws in Pyro has some kickass, distinct, and resilient armor. Since we respect the rule of law as much as they do, we made a limited run of armor inspired by them. If they have a problem with it, they can come find us.  \n\nThe Overlord armor lets your foes know that you mean business. This heavy armor set is constructed with durable composite plating strategically placed to disperse the force of impacts and a high, reinforced collar that provides additional protection for your neck and back of head. The suit also layers in high-strength synthetic fabrics around the joints to ensure ease of moment without sacrificing safety. The Overlord is available in several distinct colors worn by members of the (in)famous faction. Maybe just don't wear one while in Pyro unless you're looking for trouble. Don't say we didn't warn you!
item_Desc_srvl_heavy_armor_01_legs=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -77 / 107 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 8.0 µSCU\n\nSome consider the Overlords heroes and other criminals. Doomsday doesn't care either way. All we know is that the vigilante group that made a name for itself targeting outlaws in Pyro has some kickass, distinct, and resilient armor. Since we respect the rule of law as much as they do, we made a limited run of armor inspired by them. If they have a problem with it, they can come find us.  \n\nThe Overlord armor lets your foes know that you mean business. This heavy armor set is constructed with durable composite plating strategically placed to disperse the force of impacts and a high, reinforced collar that provides additional protection for your neck and back of head. The suit also layers in high-strength synthetic fabrics around the joints to ensure ease of moment without sacrificing safety. The Overlord is available in several distinct colors worn by members of the (in)famous faction. Maybe just don't wear one while in Pyro unless you're looking for trouble. Don't say we didn't warn you!
item_Desc_srvl_heavy_core_01=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -77 / 107 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 8.0 µSCU\nBackpacks: All\n\nSome consider the Overlords heroes and other criminals. Doomsday doesn't care either way. All we know is that the vigilante group that made a name for itself targeting outlaws in Pyro has some kickass, distinct, and resilient armor. Since we respect the rule of law as much as they do, we made a limited run of armor inspired by them. If they have a problem with it, they can come find us.  \n\nThe Overlord armor lets your foes know that you mean business. This heavy armor set is constructed with durable composite plating strategically placed to disperse the force of impacts and a high, reinforced collar that provides additional protection for your neck and back of head. The suit also layers in high-strength synthetic fabrics around the joints to ensure ease of moment without sacrificing safety. The Overlord is available in several distinct colors worn by members of the (in)famous faction. Maybe just don't wear one while in Pyro unless you're looking for trouble. Don't say we didn't warn you!
item_Desc_srvl_heavy_helmet_01=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -77 / 107 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nRemain fully protected and anonymous without feeling a great weight on your head. The Overlord helmet delivers heavy armor protection while using a special lightweight composite plating that makes it feel like nothing's there. Repurposed ocular sensors normally found on ships keep you attuned to your surroundings and, when worn with the full Overlord suit, the high neck collar provides the helmet extra support and protection. Visor is AR crosshair compatible.
item_Desc_srvl_undersuit_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nFeaturing the same relatively reliable construction as the Why Not helmet, the Second Life takes some of those tattered old undersuits and gives them new life.
item_Desc_srvl_undersuit_02_01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nRoughly sewn together from a variety of ransacked materials, the Wastelander undersuit will just about do the job.
item_Desc_srvl_undersuit_02_01_02=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nRoughly sewn together from a variety of ransacked materials, the Wastelander undersuit will just about do the job. This version features a bold rust color.
item_Desc_srvl_undersuit_helmet_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nJust because a helmet's broken doesn't mean it's useless. This scavenged undersuit helmet should provide suitable protection against vacuum. If you like taking chances, take a chance on this. Why not? 
item_Desc_syfb_flightsuit_helmet_01_01_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nAdapted by Syang Fabrication to meet the unique requirements of the Human physique, the Xanthule helmet faithfully recreates the bold silhouette preferred by Xi'an. When paired with the Xanthule suit, it creates a distinct and eye-catching look.
item_Desc_syfb_flightsuit_helmet_01_01_02=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nAdapted by Syang Fabrication to meet the unique requirements of the Human physique, the Xanthule helmet faithfully recreates the bold silhouette preferred by Xi'an. When paired with the Xanthule suit, it creates a distinct and eye-catching look.
