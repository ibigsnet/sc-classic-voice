item_Desc_rsi_explorer_undersuit_01_concierge=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nWhether you’re discovering bold new frontiers or simply stretching your legs after a long spaceflight, Robert Space Industries’ Venture Explorer Suit takes vacuum-safe wear to the next level with its incorporation of top-of-class safety features seamlessly blended with phenomenal freedom of movement. This exclusive executive edition features a dynamic black and gold color palette. 
item_Desc_rsi_explorer_undersuit_01_iae2023_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nWhether you’re discovering bold new frontiers or simply stretching your legs after a long spaceflight, Robert Space Industries’ Venture Explorer Suit takes vacuum-safe wear to the next level with its incorporation of top-of-class safety features seamlessly blended with phenomenal freedom of movement. This special IAE 2953 edition has a black and grey color palette with copper accents.
item_Desc_rsi_explorer_undersuit_01_ruso=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nWhether you’re discovering bold new frontiers or simply stretching your legs after a long spaceflight, Robert Space Industries’ Venture Explorer Suit takes vacuum-safe wear to the next level with its incorporation of top-of-class safety features seamlessly blended with phenomenal freedom of movement. The Rust Society edition adds a red and tan color scheme so you look good while working hard.
item_Desc_rsi_odyssey_undersuit_01_Shared=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nThe latest generation of RSI's classic Odyssey undersuit features a new rugged design capable of withstanding the harshest of conditions in space or planetside. Built using the latest microweave technology, the Odyssey II undersuit provides hours of comfort in locations that are anything but comfortable.
item_Desc_rsi_odyssey_undersuit_helmet_01_01_coramor=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nContinuing RSI's legacy of rugged and reliable helmets, the Odyssey II streamlines the original design into a lighter frame without sacrificing durability. This omni-purpose helmet was extensively field-tested in a variety of conditions and environments to keep you safe every time you suit up. This special Lovestruck edition features a stylish metallic pink and black color scheme inspired by the colors of the Coramor festival.
item_Desc_rsi_odyssey_undersuit_helmet_01_01_opaque=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nContinuing RSI's legacy of rugged and reliable helmets, the Odyssey II streamlines the original design into a lighter frame without sacrificing durability. This omni-purpose helmet was extensively field-tested in a variety of conditions and environments to keep you safe every time you suit up. This special Obsidian variant features a darkened visor for anyone looking to maintain their anonymity.
item_Desc_rsi_odyssey_undersuit_helmet_01_02_coramor=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nContinuing RSI's legacy of rugged and reliable helmets, the Odyssey II streamlines the original design into a lighter frame without sacrificing durability. This omni-purpose helmet was extensively field-tested in a variety of conditions and environments to keep you safe every time you suit up. This special Envy edition inspired by the Coramor festival features a vibrant pink and purple color scheme for the most enthusiastic of lovers.
item_Desc_rsi_odyssey_undersuit_helmet_01_03_coramor=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nContinuing RSI's legacy of rugged and reliable helmets, the Odyssey II streamlines the original design into a lighter frame without sacrificing durability. This omni-purpose helmet was extensively field-tested in a variety of conditions and environments to keep you safe every time you suit up. This special Starcrossed edition is modeled after the armor worn by Yuri Ilyin in the famous 25th century vid, Coramor, which inspired the eponymous lovers' festival.
item_Desc_rsi_odyssey_undersuit_helmet_01_Shared=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nContinuing RSI's legacy of rugged and reliable helmets, the Odyssey II streamlines the original design into a lighter frame without sacrificing durability. This omni-purpose helmet was extensively field-tested in a variety of conditions and environments to keep you safe every time you suit up.
item_Desc_rsi_odyssey_undersuit_helmet_02_01_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nWhen flying through the dangerous reaches of space, it's common for brave pilots to routinely face down death as part of their every day. Now with the Azrael helmet from CC's Conversions you can look the part with the grim visage of a skull peering out from beneath the visor of this otherwise normal looking helmet.
item_Desc_rsi_odyssey_undersuit_helmet_02_02_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nWhen flying through the dangerous reaches of space, it's common for brave pilots to routinely face down death as part of their every day. Now with the Azrael helmet from CC's Conversions you can look the part with the grim visage of a skull peering out from beneath the visor of this otherwise normal looking helmet.\n\nThe Ruby version casts the skull in a bold red light.
item_Desc_rsi_odyssey_undersuit_helmet_02_03_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nWhen flying through the dangerous reaches of space, it's common for brave pilots to routinely face down death as part of their every day. Now with the Azrael helmet from CC's Conversions you can look the part with the grim visage of a skull peering out from beneath the visor of this otherwise normal looking helmet.\n\nThe Sapphire version casts the skull in a pixelated blue light.
item_Desc_rsi_pilot_flightsuit_helmet_01=Item Type: Flight Helmet\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nRSI's Odyssey helmet is so light and unobtrusive, you'll almost forget you're wearing it. The durable impact-resistant carbon fiber construction with shock-absorbing foam inserts and a single piece molded laminate visor that provides maximum field of view horizontally and vertically.
item_Desc_slaver_armor_light_01_core=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -39 / 69 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\nBackpacks: Light                                                         \n\nDesigned to be an EVA-compliant light combat suit, the Calico set is the perfect armor suit for infiltrators, snipers, thieves, basically anyone who likes to avoid kicking in doors. Built out of a combination of PAB3 armor and a custom helmet, it can help you weather some incoming fire without slowing you down.
item_Desc_slaver_armor_light_01_legs=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -39 / 69 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\n\nDesigned to be an EVA-compliant light combat suit, the Calico set is the perfect armor suit for infiltrators, snipers, thieves, basically anyone who likes to avoid kicking in doors. Built out of a combination of PAB3 armor and a custom helmet, it can help you weather some incoming fire without slowing you down.
item_Desc_slaver_armor_medium_01_core=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -60 / 90 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 6.4 µSCU\nBackpacks: Medium, Light                                        \n\nThe DustUp has your back if you’re looking to get into some trouble. The body plating is built off of the same CDS undersuit used by the UEE Marines, it adds reconstructed Omni-Role mkII pieces to give you solid protection against incoming fire, but the real gem is the modified helmet. That thing was built to withstand explosions, so it should totally protect you against some shots. The whole thing’s been reasonably tested against vacuum too, so you can feel free to EVA all you want without worrying about dying.
item_Desc_slaver_combat_heavy_core_01_02_01=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -72 / 102 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nIncorporating the same manufacturing know-how and expertise that the UEE Marines have come to rely on, Clark Defense Systems has designed their civilian-line of Defiance heavy armors to stand firm in the face of even the most adverse combat scenarios with its three-star rated protective plating and fully integrated mobility framework.\n\nThe Ultimatum edition features the signature neon pink iconography of the Nine Tails gang.
