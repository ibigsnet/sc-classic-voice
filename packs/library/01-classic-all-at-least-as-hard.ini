item_Desc_syfb_flightsuit_suit_01_iae2023_01=Item Type: Flight Suit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 6.5 µSCU\nBackpacks: Light\n\nPerfected through centuries of innovation, Syang Fabrication's sleek and stylish Xanthule flight suit has been meticulously adapted to the Human physique. The Xanthule suit features breathable lightweight plating made with a carbon-silk weave that provides reliable protection while maintaining the famed House's signature aesthetic. This special IAE 2953 edition is decorated with a copper and white pattern inspired by Gatac Manufacture's Syulen.
item_Desc_uba_prison_undersuit_01=Item Type: Worksuit\nDamage Reduction: 10%\nTemp. Rating: -75 / 75 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nThe Inmate Worksuit is a durable and highly visible worksuit designed to survive harsh conditions often faced by inmates during work release programs. The worksuit integrated reinforced padding for protection with a strong synthetic weave that meets the minimal government standard for thermal insulation while keeping costs low. The sturdy workpack provides ample storage capacity and evenly distributes weight across the wearer's back allowing them to carry more during every shift. It also features secure bottom straps to allow you to determine oxygen tank size on a per inmate basis, minimizing escape risk.
item_Desc_vgl_undersuit_01_01_Shared=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nVirgil's ForceFlex is the next generation in undersuit technology. Rated for combat as well as industrial work, you can rest assured that the comboweave will keep you protected in whatever situation you put it through.
item_Desc_vgl_utility_light_arms_01_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -32 / 62 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nBe the first on the scene with the Chiron armor. Designed to provide the essential protection that combat medics need, the armor features ultra-lightweight panelling to keep the wearer quick on their feet without compromising on safety. Crucial, high-impact sections have been reinforced with raised carbon plating on top of a highly durable polyfiber for maximum flexibility.
item_Desc_vgl_utility_light_arms_02_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -32 / 62 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nBe the first on the scene with the Chiron armor. Designed to provide the essential protection that combat medics need, the armor features ultra-lightweight panelling to keep the wearer quick on their feet without compromising on safety. Crucial, high-impact sections have been reinforced with raised carbon plating on top of a highly durable polyfiber for maximum flexibility.\n\nThe Heartthrob edition is a dreamy, shimmering violet adorned with bright digital hearts; perfect for making friends and foes weak in the knees.
item_Desc_vgl_utility_light_arms_03_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -32 / 62 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nBe the first on the scene with the Chiron armor. Designed to provide the essential protection that combat medics need, the armor features ultra-lightweight panelling to keep the wearer quick on their feet without compromising on safety. Crucial, high-impact sections have been reinforced with raised carbon plating on top of a highly durable polyfiber for maximum flexibility.\n\nThe AA Support edition uses sharp red coloring and bright yellow detailing, ensuring that Alliance Aid Support Units remain visible while assisting the people of Levski through their crisis.
