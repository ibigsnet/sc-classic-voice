Stanton2a_Desc=Named after the youngest of the three siblings featured in the 25th century children’s morality tale, 'A Gift for Baba,' this moon features over a hundred currently dormant volcanoes that are said to represent Cellin’s simmering anger.
Stanton2b_Desc=Named after the middle brother of the three siblings featured in the 25th century children’s morality tale, 'A Gift for Baba,' this is the largest of Crusader’s moons. Daymar’s slightly eccentric orbit is said to represent his ease at getting lost in the story.
Stanton2c_Desc,P=Named after the oldest of the three siblings featured in the 25th century children’s morality tale, 'A Gift for Baba,' this moon has a water-ice crust said to represent Yela’s cool and calculating mannerisms.\n\nPotential Ship Mineables:\nBeryl\nHephasestanite\nAgricium\nLaranite\nBorase\nGold\nTaranite\nBexalite\nQuantanium\nAluminium\nTitanium\n\nPotential Hand Mineables:\nHadanite\nAphorite\nDolivine
Stanton3a_Desc,P=This icy moon features active cryogeysers and cryovolcanoes.\n\nPotential Ship Mineables:\nBeryl\nHephasestanite\nAgricium\nLaranite\nBorase\nGold\nTaranite\nBexalite\nQuantanium\nQuartz\nCorundum\nTungsten\n\nPotential Hand Mineables:\nHadanite\nAphorite\nDolivine
Stanton4_Desc=A terraforming error left the planet with an unnaturally dense cloud cover and a colder than average climate making it an ideal location for owner microTech to house its heat-sensitive computing and manufacturing centers.
Stanton4_NewBab_NBIS=NBIS Terminal
Stanton4a_Desc,P=Named after the ancient Greek muse who inspires eloquence to supposedly remind those gazing upon the moon from microTech to ‘strive for pure expression of thought.’\n\nPotential Ship Mineables:\nBeryl\nHephasestanite\nAgricium\nLaranite\nBorase\nGold\nTaranite\nBexalite\nQuantanium\nQuartz\nCorundum\n\nPotential Hand Mineables:\nHadanite\nAphorite\nDolivine
Stanton4b_Desc,P=Named after the ancient Greek muse of history to supposedly remind those gazing upon the moon from microTech to remember that ‘their work stands on those who came before them.’\n\nPotential Ship Mineables:\nBeryl\nHephasestanite\nAgricium\nLaranite\nBorase\nGold\nTaranite\nBexalite\nQuantanium\nQuartz\nCorundum\n\nPotential Hand Mineables:\nHadanite\nAphorite\nDolivine
StantonSystem=Stanton
TheCollector_Conversion_SpecialFavors_Desc=Wikelo need large amounts of <EM4>quantanium</EM4> and is willing to give you nice Polaris in exchange but also know many humans not have much space, so you trade as you go. Wikelo will you <EM4>Polaris bits</EM4> if you want trade quantanium. Work like favors. Help Wikelo remember how much you give. \n\nBring quantanium to <EM4>~mission(destination|ListAll)</EM4> and will trade for bits.\n\nBye.
TheCollector_GenericCollect_Long,P=Bring ~mission(amount)/~mission(total) of ~mission(item). Bring to ~mission(destination|ListAll).
TheCollector_MultiReward_Notification=You've earned: ~mission(rewardAmount) rewards\nAccess them at ~mission(destination|ListAll) ~mission(kioskType)
TheCollector_PolarisBit_Desc=Similar to Wikelo's <EM4>favors</EM4>, Polaris Bits are a unique marker to indicate that a specified allocation of <EM4>quantanium</EM4> have been successfully delivered to Wikelo. These bits can be put towards the purchase of a Polaris.
Tut03_Part02_Hint01_ToASOP=Interact [~action(player_choice|pc_interaction_mode)] with a Fleet Manager Terminal to access the Tutorial Ship. First press “Deliver”, then “Retrieve” to have it brought to a hangar.
UI_TooltipEntitlement_Bricking,P=Bricking: 
UWC_Refueling_easy_desc_001=Hey there,\n\nIf you're fitted for refueling, you might like this one. \n\nA beacon has just gone live at <EM4>~mission(Location|Address)</EM4>, from a client whose <EM4>~mission(Ship)</EM4> is running on empty, so make sure your fuel pods are topped off.\n\nThe client vessel will pay you at the rate of <EM4>~mission(FuelRate) aUEC per SCU of Hydrogen</EM4> and  <EM4>~mission(QTFuelRate) aUEC per SCU of Quantum </EM4>, and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nLooks like a zero-drama one and done, but it never hurts to keep your scanners live.\nLet me know if you're interested and let's get these good people on their way.\n\nWaiting to hear from you,\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"
UWC_Refueling_intro_desc_001=Hey!\n\nDD from the United Wayfarers Club here.\n\nThe UWC offers repair, rearming and refuelling services across the UEE. It just so happens that we're on the look-out for new affiliates whose ships are fitted for refuelling. If you've got the fuel pods and like it when people are pleased to see you, the UWC might be the club for you.\n\nAnd if you think it might be, I've got a live beacon you might like.\n\nIf you do happen to like it, a word to the wise: <EM4>make sure your fuel pods are full before you head out</EM4>.\n\nA Club member has run out of fuel at <EM4>~mission(Location|Address)</EM4>. I'm not sure on the details, like how they ended up out there with no Go Juice, but the UWC doesn't like to leave folk hanging.\n\nThe client vessel will pay you at the rate of <EM4>~mission(FuelRate) aUEC per SCU of Hydrogen</EM4> and  <EM4>~mission(QTFuelRate) aUEC per SCU of Quantum </EM4>. As a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nIt's a straightforward run. Perfect if you want to get a feel for this kind of job. Get out there, fill up the tanks of their <EM4>~mission(Ship)</EM4> and get them on their way. Do enough runs like this, and the process becomes muscle memory. Until then, there's a <EM4>journal entry</EM4> on your mobiGlas called ""Refueling Protocols"" that covers the basics.\n\nThere have been no reports of outlaw activity in that sector, but stay alert. I always recommend you aim for a fast turnaround. The sooner you're done, the sooner I can fix you up with another contract. UWC's always looking for new affiliates. \n\nLooking forward to working with you.\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"
UWC_Refueling_multiple_med_desc_001,P=Hey again,\n\nI've got a beacon at <EM4>~mission(Location|Address)</EM4> and this one's a big one. An entire little fleet of ships all burned out of fuel at the same time. Impressive coordination and lack of planning at the same time. \n\nThe client vessel will pay you at the rate of <EM4>~mission(FuelRate) aUEC per SCU of Hydrogen</EM4> and  <EM4>~mission(QTFuelRate) aUEC per SCU of Quantum </EM4>, and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nHopefully since the area they're in is pretty safe, there shouldn't be too much trouble lurking, but these days you never know. Wouldn't hurt to get them back flying again as quick as you're able.\n\nHappy trails,\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"
UWC_Refueling_multiple_med_title_001=URGENT FLEET REFUEL
Vaughn_EliminateSpecific_FPS_storm_H_desc_003=A previous target I had thought to have been eliminated seems to have resurfaced as a hired merc over at <EM4>~mission(Location)</EM4> working for ASD. While I am surpremely disappointed with the contractor who claimed to have eliminated <EM4>~mission(TargetName|Last)</EM4>, I'm going to re-open the original contract and give it to you to finish it.\n\nThey are currently stationed at an operational facility, so they will not be alone. Use your discretion in executing the contract, but know that <EM4>~mission(TargetName)</EM4> is the priority.\n\nI trust you'll do better than my former subcontractor,\n\nVaughn
Vaughn_EliminateSpecific_FPS_storm_H_desc_004=Have a difficult contract for a discerning operative. Target's name is <EM4>~mission(TargetName)</EM4>. They're currently working as hired security for Associated Science & Development and posted at <EM4>~mission(Location)</EM4>, a far cry from their previous career as a syndicate enforcer and bagman.\n\nI'll need you to get in and take out <EM4>~mission(TargetName|Last)<EM4> which is easier said then done as they will undoubtedly be entrenched with other corporate security forces, but I believe you'll figure it out.\n\nAll the best,\n\nVaughn
Vehicle_DescGRIN_UTV=Manufacturer: Greycat Industrial\nFocus: Cargo\n\nThe Greycat UTV is a durable, utility buggy designed to transport light cargo loads across rugged terrain. Whether you’re coordinating freight storage or making a supply run to a neighboring outpost, the straightforward design of the UTV allows operators to focus on tackling the job at hand.
