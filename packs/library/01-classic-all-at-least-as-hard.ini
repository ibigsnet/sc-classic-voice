Shubin_Industrial_GroundVehicle_Nyx_VH_Interstellar_Desc_001=POSTING: Industrial\nLOCATION: ~mission(System)\nREQ EXPERIENCE: Vehicle Mining\n\nTERMS*: \n\nShubin Interstellar is in need of some extremely valuable ore, located in <EM4>~mission(System)</EM4>.\n\nOur surveyors have reported that the now defunct Hathor Group were able to access this ore on <EM4>Daymar and Aberdeen</EM4>. Our suggestion would be to head to the Platform Alignment Facilities (PAF) and attempt to reactivate their Orbital Laser Platform (OLP) to mine the ore below the planet's surface.\n\nAll Shubin Interstellar contractors are expected to provide their own equipment. For this contract you will need a <EM4>~mission(Hint_Tool)</EM4>.\n\nOnce you have successfully gathered the materials, deposit them in the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\nDISCLAIMER: As a part of our Employee Incentive Program, Shubin Interstellar is willing to award contractors by <EM4>allowing them to keep any surplus materials that they obtain from this contract</EM4>. This surplus can be sold at a local kiosk at the contractor's discretion.\n\n\n*Shubin Interstellar is an equal opportunity contractor. By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract.
Shubin_Industrial_GroundVehicle_Nyx_VH_Interstellar_Title_001=Ground Vehicle Mining Request: Major Scale
Shubin_Industrial_GroundVehicle_Pyro_E_DiscoverPlanetary_Desc_001=POSTING: Industrial\nLOCATION: ~mission(System)\nREQ EXPERIENCE: Vehicle Mining\n\nTERMS*: \n\nShubin Interstellar is in need of a variety of ore, mineable from numerous locations across <EM4>~mission(System)</EM4>.\n\n~mission(Hint_Location)\n\nFor a comprehensive list of where to find these minerals, consult <EM4>Mining Fundamentals #2: Where to Mine</EM4> in your mobiGlas Journal.\n\nAll Shubin Interstellar contractors are expected to provide their own equipment. For this contract you will need a <EM4>~mission(Hint_Tool)</EM4>.\n\nOnce you have successfully gathered the materials, deposit them in the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\nDISCLAIMER: As a part of our Employee Incentive Program, Shubin Interstellar is willing to award contractors by <EM4>allowing them to keep any surplus materials that they obtain from this contract</EM4>. This surplus can be sold at a local kiosk at the contractor's discretion.\n\n\n*Shubin Interstellar is an equal opportunity contractor. By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract.
Shubin_Industrial_GroundVehicle_Pyro_E_DiscoverPlanetary_Title_001=Ground Vehicle Mining Request: Small Scale
Shubin_Industrial_GroundVehicle_Pyro_H_Solar_Desc_001=POSTING: Industrial\nLOCATION: ~mission(System)\nREQ EXPERIENCE: Vehicle Mining\n\nTERMS*: \n\nShubin Interstellar is in need of a variety of ore, mineable from numerous locations across <EM4>~mission(System)</EM4>.\n\n~mission(Hint_Location)\n\nFor a comprehensive list of where to find these minerals, consult <EM4>Mining Fundamentals #2: Where to Mine</EM4> in your mobiGlas Journal.\n\nAll Shubin Interstellar contractors are expected to provide their own equipment. For this contract you will need a <EM4>~mission(Hint_Tool)</EM4>.\n\nOnce you have successfully gathered the materials, deposit them in the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\nDISCLAIMER: As a part of our Employee Incentive Program, Shubin Interstellar is willing to award contractors by <EM4>allowing them to keep any surplus materials that they obtain from this contract</EM4>. This surplus can be sold at a local kiosk at the contractor's discretion.\n\n\n*Shubin Interstellar is an equal opportunity contractor. By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract.
