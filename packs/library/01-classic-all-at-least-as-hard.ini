EckhartSecurity_DestroyServers_FacilityDelving_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Destroy Server\nAPPROVAL CODE = VS-14\n\nFOR IMMEDIATE PROCESSING\n\nOur client has requested the immediate destruction of a group of servers located at a long-shuttered ASD research site, <EM4>~mission(Location|Address)</EM4>. The servers in question contain information that our client considers extremely damaging and is eager to see the data completely eliminated.\n\nInitial surveillance indicates the servers are within the facility’s <EM4>Energy Lab, located in the Research wing</EM4>. We’ve also picked up on a number of hostile forces, so be on alert.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.
EckhartSecurity_DestroyServers_FacilityDelving_Desc_002=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Destroy Server\nAPPROVAL CODE = VS-14\n\nFOR IMMEDIATE PROCESSING\n\nA client has asked us to infiltrate an old ASD research site, <EM4>~mission(Location|Address)</EM4>, and wipe the contents of a few specific servers there.\n\nWe believe the servers are located somewhere within the <EM4>Xenotech Lab, in the Research wing</EM4>. The client has also informed us that despite the facilities being publicly declared as closed, you're still likely to find hostile forces there.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.
EckhartSecurity_DestroyServers_FacilityDelving_Desc_003=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Destroy Server\nAPPROVAL CODE = VS-14\n\nFOR IMMEDIATE PROCESSING\n\nThis a simple seek and destroy contract. The client has requested that several servers located at <EM4>~mission(Location|Address)</EM4> be destroyed as soon as possible. Under no circumstances should these servers be accessed, or copies of the data made.\n\nThe client believes that the servers are somewhere in the <EM4>Engineering wing</EM4>, most likely in the <EM4>Management</EM4> area. In addition to this, there is a strong chance you won’t be the only presence on-site so be wary of potential hostiles.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.
EckhartSecurity_DestroyServers_FacilityDelving_Desc_004=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Destroy Server\nAPPROVAL CODE = VS-14\n\nFOR IMMEDIATE PROCESSING\n\nClient has requested a discreet contractor to infiltrate <EM4>~mission(Location|Address)</EM4>, locate a group of servers, and destroy the information stored on them permanently.\n\nThe client was able to share the location of the servers within the facility: the <EM4>Control Center in the Engineering wing</EM4>. The site has officially been shuttered, but there still may be hostile forces there. Be on your guard.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.
EckhartSecurity_EliminateAll_DC_Desc_001=ECKHART SECURITY, LLC.\nCONTRACTS & DISPATCH\n\nCONTRACT TYPE: Clear Location\nAPPROVAL CODE = ~mission(ApprovalCode)\n\nFOR IMMEDIATE PROCESSING\n\nA client is sending frantic comms that one of their locations is under attack. We need a contractor who can hustle to <EM4>~mission(Location|Address)</EM4> and clear the location of hostile actors. \n\nAccording to onsite personnel, the outlaws are currently holed up near the </EM4>~mission(Location)</EM4>. Approach with caution and be prepared to use lethal force if the outlaws resist being removed.\n\nPayment will be issued upon successful completion of contract.\n\nThis contract is non-negotiable.\n\nThis message may contain confidential, proprietary, privileged and/or private information. The information is intended to be for the use of the individual or entity designated above.
FTL_RecoverItem_E_Desc_001=ATTENTION ALL FTL COURIERS\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \nRECOMMENDED EXPERIENCE LEVEL – ENTRY\n\nPICKUP LOCATION – Courier needed to retrieve lost package from a downed ship at <EM4>~mission(Location|Address)</EM4>.\n\nDROPOFF LOCATION – Once obtained, deliver package to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>. \n\nTHREAT LEVEL – <EM4>Light engagements</EM4> expected.\n\nTRAVEL – All transportation needs should be arranged by courier. \n\n~mission(Contractor|SignOff)
FTL_RecoverItem_H_Desc_001=ATTENTION ALL FTL COURIERS\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \nRECOMMENDED EXPERIENCE LEVEL – SEASONED\n\nPICKUP LOCATION – Courier needed to retrieve package at <EM4>~mission(Location|Address)</EM4> and continue delivery.\n\nDROPOFF LOCATION – Deliver package to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>. \n\nTHREAT LEVEL – <EM4>High level engagements</EM4> expected.\n\nTRAVEL – All transportation needs should be arranged by courier. \n\n~mission(Contractor|SignOff)
FTL_RecoverItem_Intro_Desc_001=ATTENTION ALL FTL COURIERS\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \n\nPICKUP LOCATION – One of our ships went down at <EM4>~mission(Location|Address)</EM4>. Need a courier to retrieve the package.\n\nDROPOFF LOCATION – Package will need to be delivered to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>. \n\nTHREAT LEVEL – <EM4>Minimal combat</EM4> expected.\nTRAVEL – All transportation needs should be arranged by courier. \n\n~mission(Contractor|SignOff)
FTL_RecoverItem_M_Desc_001=ATTENTION ALL FTL COURIERS\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \nRECOMMENDED EXPERIENCE LEVEL – JUNIOR\n\nPICKUP LOCATION – An FTL ship went down at <EM4>~mission(Location|Address)</EM4>. Courier needed to retrieve package and continue delivery.\n\nDROPOFF LOCATION – Package must be taken to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>. \n\nTHREAT LEVEL – <EM4>Medium level engagements</EM4> expected.\n\nTRAVEL –  All transportation needs should be arranged by courier. \n\n~mission(Contractor|SignOff)
FTL_RecoverItem_S_Desc_001=ATTENTION ALL FTL COURIERS\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \nRECOMMENDED EXPERIENCE LEVEL – ELITE\n\nPICKUP LOCATION – Top-tier courier required to retrieve a package at <EM4>~mission(Location|Address)</EM4> from wreckage of a downed courier.\n\nDROPOFF LOCATION – Deliver package to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>. \n\nDELIVERY WINDOW – ~mission(Contractor|Timed)\n\nTRAVEL –  All transportation needs should be arranged by courier. \n\n~mission(Contractor|SignOff)
FTL_RecoverItem_VE_Desc_001=ATTENTION ALL FTL COURIERS\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \nRECOMMENDED EXPERIENCE LEVEL – UNIVERSAL\n\nPICKUP LOCATION – Need a courier dispatched to <EM4>~mission(Location|Address)</EM4> to retrieve a package from a downed ship.\n\nDROPOFF LOCATION – Package will need to be delivered to <EM4>the freight elevator at ~mission(Destination|Address)</EM4>. \n\nTHREAT LEVEL – <EM4>Light engagements</EM4> expected.\n\nTRAVEL– All transportation needs should be arranged by courier. \n\n~mission(Contractor|SignOff)
FTL_RecoverItem_VH_Desc_001=ATTENTION ALL FTL COURIERS\nFOR IMMEDIATE ASSIGNMENT\n\n**CONTRACT DETAILS** \nRECOMMENDED EXPERIENCE LEVEL – EXPERIENCED\n\nPICKUP LOCATION – Need an experienced courier to dispatch to <EM4>~mission(Location|Address)</EM4> and retrieve a package from a downed ship.\n\nDROPOFF LOCATION – Once secured, finish delivery by dropping off at <EM4>the freight elevator at ~mission(Destination|Address)</EM4>. \n\nTHREAT LEVEL – <EM4>Intense Hostile Contact</EM4> Expected.\n\nTRAVEL – All transportation needs should be arranged by courier. \n\n~mission(Contractor|SignOff)
Foxwell_ShipAmbush_VE_desc_001=Care to help us ghost a bad guy? \n\nWe’ve been hired to hunt down an outlaw flying a </EM4>~mission(AmbushTarget)</EM4>. Shouldn’t be too hard since they take the same flightpath each day. That makes them a prime target for an ambush if I ever saw one. I’ve analyzed the route and determined that <EM4>~mission(Location|Address)</EM4> is the ideal spot to strike. There’s an emission cloud there that’ll be perfect to hide your ship’s signature while you wait.   \n\nJob is simple if you’re interested. Head to the location, hide out, power down, and then wait for them to fly by. Sometimes they roll alone but they often have other single-seat ships with them. Shouldn’t be too hard to handle for a pro. Plus, we’ll still have reinforcements nearby and ready to deploy once it pops off.\n\nPull this off and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
