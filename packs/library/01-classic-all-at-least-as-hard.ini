item_Desc_cds_combat_medium_legs_03_01_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4.0 µSCU\n\nThis version of CDS' ORC-mkX combat armor has been modified from its original form. The mark X is part of CDS’ award-winning Omni-Role Combat armor series. This EVA-rated suit features new EdgeCore composite weave technology, maximizing protection against projectiles, explosives and the elements while minimizing operator agility.
item_Desc_cds_combat_medium_legs_04_01_xenothreat=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4.0 µSCU\n\nThis version of CDS' ORC-mkX combat armor has been modified from its original form. The mark X is part of CDS’ award-winning Omni-Role Combat armor series. This EVA-rated suit features new EdgeCore composite weave technology, maximizing protection against projectiles, explosives and the elements while minimizing operator agility.
item_Desc_cds_combat_superheavy_suit_01_01_01=Item Type: Super Heavy Armor\nDamage Reduction: 90%\nTemp. Rating: -70 / 100 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4.0 µSCU\n\nRedefine personal protection with the BUL-H4 series. Utilizing advanced synthetic polymers, impacts are significantly mitigated transforming the wearer into a bulwark of defense. The armor's power-assisted frame helps maintain mobility, offsetting the heavy weight of the suit.
item_Desc_cds_combat_superheavy_suit_01_04_01=Item Type: Super Heavy Armor\nDamage Reduction: 90%\nTemp. Rating: -70 / 100 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4.0 µSCU\n\nRedefine personal protection with the BUL-H4 series. Utilizing advanced synthetic polymers, impacts are significantly mitigated transforming the wearer into a bulwark of defense. The armor's power-assisted frame helps maintain mobility, offsetting the heavy weight of the suit.\n\nThe SteelTek edition features a shining metallic silver with a mercurial pattern that runs across the surface.
item_Desc_cds_combat_superheavy_suit_02_01_01=Item Type: Super Heavy Armor\nDamage Reduction: 90%\nTemp. Rating: -70 / 100 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4.0 µSCU\n\nRedefine personal protection with the BUL-H4 series. Utilizing advanced synthetic polymers, impacts are significantly mitigated transforming the wearer into a bulwark of defense. The armor's power-assisted frame helps maintain mobility, offsetting the heavy weight of the suit.\n\nThe Stronghold edition features the fierce symbology of the Nine Tails gang with bold neon pink accents. 
item_Desc_cds_undersuit_01_crus01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThis comprehensive Tactical Combat Suit provides a complete sealed suit against vacuum, free range of motion, and interfaces seamlessly with compatible armor systems. The Crusader Edition was made specifically for the company's security services.
item_Desc_cds_undersuit_armor_01_02_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nUsing materials made with orb-weave technology, CDS has created a lightweight, durable undersuit that has been designed to meet the needs of on-the-ground combatants. It was made to match the limited-edition GCD-Army medium armor, but is compatible with a wide range of other sets.
item_Desc_cds_undersuit_helmet_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe A23 has been one of CDS' mainstay helmet systems for years. Built out of impact-resistant composite technology and a hardened laminate faceplate, the A23 is perfect for hazardous environment and basic EVA operations. Visor is AR crosshair compatible.
item_Desc_clda_undersuit_01_01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nFeaturing flexible gaskets for greater comfort and more natural movement, along with a convenient range of chest connector port options, the Levin from Caldera has been a practical choice for explorers everywhere. This particular undersuit has been repaired for extended use.
item_Desc_clda_undersuit_02=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nBuilt for adventure but comfortable enough for everyday, the Markanda undersuit has become beloved by explorers. A unique patchwork design creates a flexible yet resilient undersuit, while an odor resistant SureSoft inner lining will keep you from wanting to take it off. This particular undersuit has been repaired for extended use.
item_Desc_clda_undersuit_02_02_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nBuilt for adventure but comfortable enough for everyday, the Markanda undersuit has become beloved by explorers. A unique patchwork design creates a flexible yet resilient undersuit, while an odor resistant SureSoft inner lining will keep you from wanting to take it off. This edition features the colors and logo of the now defunct Pyrotechnic Amalgamated.
item_Desc_ctl_deckcrew_undersuit_01_lum01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nFeaturing durable poly-fiber fabric, a comfortable fit, and a special holiday design, this undersuit is the perfect thing to wear to any Luminalia party.
item_Desc_ctl_deckcrew_undersuit_01_lum01_06=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nFeaturing durable poly-fiber fabric, a comfortable fit, and a special holiday design, this undersuit is the perfect thing to wear to any Luminalia party.
item_Desc_ctl_deckcrew_undersuit_01_lum01_07=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nFeaturing durable poly-fiber fabric, a comfortable fit, and a special holiday design, this undersuit is the perfect thing to wear to any Luminalia party.
