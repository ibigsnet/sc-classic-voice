item_DescRazor_Paint_Red_Blue_Blue=Pull away from the pack with this daring Mirai Racing livery. Combining coral reds with an undercurrent of teal, you’re guaranteed to grab the attention of those you overtake when racing in these bold colors.
item_DescSanTokYai_Paint_AlienWeek_Teal_Pink=The Harmony livery is meant to showcase Humanity's peaceful relationship with alien species with a semi-pearlescent blue main coat marked with organic reflective red to suggest the coming together of disparate species and cultures. The Harmony livery has been designed and produced by the UEE's Diplomatic Corps and freely licensed to all spacecraft manufacturers. Now Aopoa San'tok.yāi owners can celebrate the UEE's intentions of working toward a peaceful galaxy.
item_DescSanTokYai_Paint_AlienWeek_Teal_Red=The Ocellus livery adapts and updates the iconic colors and design used on some Tevarin ships to bring a striking new look to the San'tok.yāi. The livery adds a distinct red pattern to the fuselage while shimmering green covers the rest of the ship. Grey lines swoop across the entire ship to help break up its silhouette.
item_DescSanTokYai_Paint_Black_Black_Black_Tiger=The shimmering iridescence of the Yilen livery delivers a distinct look for the San'tok.yāi.
item_DescSanTokYai_Paint_Red_Black_Black=Outfit the San'tok.yāi in fiery red and black trim with the Xuā'cha livery.
item_DescSanTokYai_Paint_White_White_Red=Make the San'tok.yāi pristine white with red trim with the Tuiping livery. 
item_DescStinger_Paint_Silver_Grey_Teal=Silvery gray highlights frame metallic blue wings in the Insularis livery for the Esperia Stinger.
item_DescSyulen_Paint_bronze_grey_red=Make your Syulen one worthy of admiration with the Kenglath livery that provides the ship a rich bronze marbled look in shades of gray and red undertones.
item_DescTalon_Paint_AlienWeek_Platinum_Silver_Purple_Mosaic=The Wanderer livery features crisscrossing purple and grey lines over a platinum foundation. Inspired by the sacred Xi'an gardens of R.aip’uāng, famous for its trails that wander in surprising ways and encourage a focus on the journey instead of the destination.
item_DescXFRG_Intakes_Aurora,P=X-Forge Aurora Fuel Intakes
item_Desc_BASL_combat_light_helmet_01_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -31 / 61 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nThe unique open-faced design makes the Advocacy Interceptor helmet a lightweight and liberating option for operating in atmosphere. It features precisely layered plating to protect the head from a variety of combat and environmental hazards and an impact resistant, anti-glare visor over the eyes. Visor is AR crosshair compatible.
item_Desc_BASL_undersuit_01_01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nFeaturing a deceptively simple design, the Advocacy Interceptor undersuit is jet black with reinforced grey protective padding on the arms and legs. Basilisk's renowned craftsmanship make this flight suit durable and supremely comfortable, leaving no mystery as to why it's widely used by the Advocacy.
item_Desc_CDS_Undersuit_Armor_02_Shared=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe FBL-8u is the first CDS undersuit to utilize the manufacturers new orb-weave technology that produces an impressively light yet strong material that can withstand the rigors of space travel. Originally developed to pair perfectly with CDS's FBL-8a light armor, it remains compatible with other armor sets.
item_Desc_CDS_Undersuit_Armor_Shared=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThis comprehensive Tactical Combat Suit provides a complete sealed suit against vacuum, free range of motion, and interfaces seamlessly with compatible armor systems.
item_Desc_CDS_undersuit_01_03_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThis comprehensive Tactical Combat Suit provides a complete sealed suit against vacuum, free range of motion, and interfaces seamlessly with compatible armor systems. The Lifeforce edition was designed with first responders in mind with a highly visible white, red, and grey color scheme.
item_Desc_COMP_WLOP_S02_Baas=Item Type: Computer\nManufacturer: WillsOp\nSize: 2\nGrade: C\nClass: Civilian\n\nThe Baas from WillsOp gives you superior performance to deliver one of the fastest and comprhensive computational experiences.
item_Desc_GRIN_utility_medium_backpack_01=Item Type: Medium Backpack\nCarrying Capacity: 85K µSCU\nCore Compatibility: Medium & Heavy\n \nOriginally designed for miners, the Aril armor comes with an attachable backpack that can accommodate a variety of tools and supplies to keep your hands free. The Aril backpack is available in a variety of vibrant colors to fit your personal taste and for easy identification on the jobsite.
item_Desc_Slaver_Undersuit_Armor_Shared=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nKastak Arms' Stoneskin series of combat undersuits are built upon CDS' famous TCS-4 system based on extensive feedback from the operators who rely on this technology in the field. Offering a myriad of options for armor and EVA capabilities, the Stoneskin is set to rival CDS as a rugged and reliable undersuit.
item_Desc_basl_combat_light_flightsuit_02_01_01=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nFeaturing a deceptively simple design, the Ace Interceptor flight suit is jet black with reinforced grey protective padding on the arms and legs. Basilisk's renowned craftsmanship make this flight suit durable and supremely comfortable, leaving no mystery as to why it's widely used by top pilots across the empire.
item_Desc_basl_combat_light_helmet_02_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nThe unique open-faced design makes the Ace Interceptor helmet a lightweight and liberating option for operating in atmosphere. It features precisely layered plating to protect the head from a variety of combat and environmental hazards and an impact resistant, anti-glare visor over the eyes. Visor is AR crosshair compatible.
item_Desc_cbd_hat_03_01_CFP_var2,P=PLACEHOLDER
item_Desc_cds_combat_heavy_core_01_02_02=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\nCarrying Capacity: 8.0 µSCU\nBackpacks: All\n\nWhen there's a difficult job at hand, you want to ensure that you can see it through to the end. Clark Defense Systems' ADP-mk4 heavy armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_heavy_legs_01_02_02=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\nCarrying Capacity: 8.0 µSCU\n\nWhen there's a difficult job at hand, you want to ensure that you can see it through to the end. Clark Defense Systems' ADP-mk4 heavy armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_light_backpack_01=Item Type: Light Backpack\nCarrying Capacity: 54K µSCU\nCore Compatibility: All\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven info the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps.
item_Desc_cds_combat_light_backpack_01_03_01=Item Type: Light Backpack\nCarrying Capacity: 54K µSCU\nCore Compatibility: All\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven info the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps.\n\nThe ASD Edition features a dark urban camo pattern alongside ASD's signature logo.
item_Desc_cds_combat_light_backpack_01_04_01=Item Type: Light Backpack\nCarrying Capacity: 54K µSCU\nCore Compatibility: All\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven info the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps.\n\nFeaturing a hooded shawl and a white digital camo pattern, the Snow Camo edition is perfect for stalking prey in frozen environments.
item_Desc_cds_combat_light_backpack_03_01_01=Item Type: Light Backpack\nCarrying Capacity: 54K µSCU\nCore Compatibility: All\n\nAn ideal synthesis of strength and technology, the Geist Stealth Armor has been crafted from military-grade carbon silk sourced from the same manufacturers that protect the UEE's special forces. Hair-thin filaments woven info the fabric mask the wearer's emissions, making them undetectable via radar, and specialized tubing built into the soles of the boots dampens the sound of footsteps.\n\nThis matte black stealth armor is embellished with intricate golden flowers, giving your enemies one final glimpse of life before death.
item_Desc_cds_combat_light_core_02_02_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -32 / 62 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\nBackpacks: Light\n\nCDS's quest to create the ideal light armor continues with the FBL-8a. This light armor will keep you fast on your feet with its strategic mix of protective plating and reinforced nano-weave fabrics. While the armor works with any undersuit, it was specifically designed to match the FBL-8u undersuit with special attention given to how the two fit together to make the set as streamlined and responsive as possible.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
