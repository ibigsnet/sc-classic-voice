item_desc_gys_undersuit_01_01_12=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nConfidently venture into the unknown with the Deep-Space undersuit. Smartly designed with several overlapping sections to guarantee the suit's integrity, Gyson has created an affordable and fashionable undersuit that helps make space travel more accessible to all.\n\nThe Shutdown version features black and gray coloring with dark metal accents.
item_desc_gys_undersuit_01_01_13=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nConfidently venture into the unknown with the Deep-Space undersuit. Smartly designed with several overlapping sections to guarantee the suit's integrity, Gyson has created an affordable and fashionable undersuit that helps make space travel more accessible to all.\n\nThe Bruiser version features dark crimson and midnight blue coloring with polished metal accents.
item_desc_gys_undersuit_01_01_14=Item Type: Undersuit\nDamage Reduction: 10%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nCarrying Capacity: 8.0 µSCU\n\nConfidently venture into the unknown with the Deep-Space undersuit. Smartly designed with several overlapping sections to guarantee the suit's integrity, Gyson has created an affordable and fashionable undersuit that helps make space travel more accessible to all.\n\nThe Brassy version features white coloring with bronze accents.
item_descarma_barrel_comp_s1_contestedzonereward=Manufacturer: ArmaMod\nType: Ballistic Compensator\nAttachment Point: Barrel\nSize: 1\n\nFire Rate: +10%\nRecoil Stability: +30%\nRecoil Kick: +20%\n\nMaintain accuracy by countering muzzle rise with the Sion Compensator1. ArmaMod's expertly designed S1 barrel attachment efficiently expels gasses to keep every shot on target. This "Tweaker" version has been unofficially modified for a faster fire rate. 
item_descarma_barrel_comp_s2_contestedzonereward=Manufacturer: ArmaMod\nType: Ballistic Compensator\nAttachment Point: Barrel\nSize: 2\n\nRecoil Stability: +70%\nRecoil Smoothness: +50%\nADS Time: +25%\nSpread: +25%\n\nMaintain accuracy by countering muzzle rise with the Sion Compensator2. ArmaMod's expertly designed S2 barrel attachment efficiently expels gasses to keep every shot on target. This "Tweaker" version has been unofficially modified for a smoother firing experience. 
item_descarma_barrel_stab_s2_contestedzonereward=Manufacturer: ArmaMod\nType: Energy Stabilizer\nAttachment Point: Barrel\nSize: 2\n\nDamage: +12.5%\nRecoil Stability: +15%\nRecoil Kick: +40%\nSpread: +25%\nAmmo Cost Per Shot: +100%\n\nReduce energy weapon recoil with the Emod Stabilizer2. ArmaMod designed the attachment to improve both horizontal and vertical recoil to ensure a more precise shot. This "Tweaker" version has been unofficially modified to do more damage.
item_descptv_paint_cherry=Speed isn’t just about mechanics, it’s about perception. Your Greycat will look and feel faster without changing a thing. The Cherry livery topcoat system uses cutting-edge raw materials and composition coating technology to maintain its glossy finish.
item_descptv_paint_double=One of the most popular liveries on the Greycat, Agate Gray is a two-toned paint scheme that brings the buggy’s interior colors as accents on the exterior, unifying the Greycat into a single cohesive aesthetic.
item_descptv_paint_metal=Who says a buggy can’t be elegant? The Gunmetal livery is a medium gloss, two-component technology that maximizes gloss retention and durability.
