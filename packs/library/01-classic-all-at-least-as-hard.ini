item_Desccrlf_medgun_01_msn_rwd02=Manufacturer: CureLife\nItem Type: Medical Device\n\nThe ParaMed from CureLife is a professional-grade emergency medical device designed to stabilize patients suffering from possible life-threatening injuries. Offering extremely accurate diagnostics and dosing, the ParaMed can treat more patients and offer longer relief with less risk of overdose.\n\nThe AA Collections edition features a sharp red coloring and was intended for those who assisted Alliance Aid's Collections Division during Levski's time of need.
item_Descgmni_optics_tsco_x4_s2_firerats02=Manufacturer: Gemini \nType: Telescopic\nAttachment Point: Optic   \nMagnification: 2x - 4x\nAim Time: +5%\nRecoil Smoothness: +10%\nSize: 2\n\nCombining a premium 4x telescopic sight with Gemini's innovative echoburst rangefinder, the OT4-RF model allows you to accurately gauge the distance to your target; vital for effective precision shooting. When paired with the Gemini S71 or other compatible weapon, the OT4-RF is engineered to impress in a variety of situations and engagements. The Scorched edition features a unique flame patina.
item_Descgmni_optics_tsco_x8_s3_firerats01=Manufacturer: Gemini \nType: Telescopic\nAttachment Point: Optic   \nMagnification: 4x - 8x\nSize: 3\n\nCombining a premium 8x telescopic sight with Gemini's innovative echoburst rangefinder, the OT8-RF model allows you to accurately gauge the distance to your target; vital for effective precision shooting. The standard scope for Gemini's A03 Sniper Rifle, the OT8-RF is engineered to impress in a variety of situations and engagements. The Scorched edition features a unique flame patina.
item_Descgrin_tractor_01_msn_rwd02=Manufacturer: Greycat Industrial\nItem Type: Tractor Beam\nClass: Gadget\n\nMagazine Size: Integrated Battery\nRate of Fire: N / A (Beam)\nEffective Range: 10-20 m\n\nGreycat's heavy duty tractor beam boasts industrial performance at a consumer-friendly price. With its longer-lasting battery and wider beam emitter, the MaxLift can easily manipulate heavier and bulkier items making it the perfect tool for long days of hauling cargo.\n\nThe AA Collections edition features a sharp red coloring and was intended for those who assisted Alliance Aid's Collections Division during Levski's time of need.
item_Deschdgw_rifle_ballistic_01=Manufacturer: Hedeby Gunworks\nItem Type: Rifle\nClass: Ballistic\n\nMagazine Size: 25\nRate Of Fire: 320 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S3)\n\nGunsmiths at Hedeby Gunworks looked to classic ballistic designs to construct a long rifle steeped in the past and the future. The Arlington provides accurate marksmanship, an easy cycling of rounds thanks to the lever action design, and multiple fire modes. Artisans shaped the weapon's body by hand to create a piece that's equally fit for the mantle as it is on the frontier.
item_Deschdgw_rifle_ballistic_01_mag=Item Type: Magazine\nCapacity: 25\n\nThis magazine for the Arlington rifle comes pre-loaded with twenty-five rounds.
item_Descnone_lmg_ballistic_01_store01=Manufacturer: Unknown\nItem Type: LMG\nClass: Ballistic\n\nMagazine Size: 120\nRate Of Fire: 355 rpm\nEffective Range: 100 m\n\nNothing like ripping through a huge mag of 50 cal bullets to scare away unwanted guests. Based on a modified FS9,  the Pulverizer LMG waste no time with pleasantries, instead lends itself to a more direct confrontational approach. \n\nThe Payback version is sprayed with red paint and anointed with bone fragments.
item_Descnone_lmg_ballistic_01_tint01=Manufacturer: Unknown\nItem Type: LMG\nClass: Ballistic\n\nMagazine Size: 120\nRate Of Fire: 355 rpm\nEffective Range: 100 m\n\nNothing like ripping through a huge mag of 50 cal bullets to scare away unwanted guests. Based on a modified FS9, the Pulverizer LMG wastes no time with pleasantries, instead lending itself to a more direct confrontational approach. \n\nThe Bloody version features a red paintjob.
item_Descnone_lmg_ballistic_01_tint02=Manufacturer: Unknown\nItem Type: LMG\nClass: Ballistic\n\nMagazine Size: 120\nRate Of Fire: 355 rpm\nEffective Range: 100 m\n\nNothing like ripping through a huge mag of 50 cal bullets to scare away unwanted guests. Based on a modified FS9, the Pulverizer LMG wastes no time with pleasantries, instead lends itself to a more direct confrontational approach. \n\nThe Mustard version features a yellow paintjob.
item_Descnone_lmg_ballistic_01_tint03=Manufacturer: Unknown\nItem Type: LMG\nClass: Ballistic\n\nMagazine Size: 120\nRate Of Fire: 355 rpm\nEffective Range: 100 m\n\nNothing like ripping through a huge mag of 50 cal bullets to scare away unwanted guests. Based on a modified FS9, the Pulverizer LMG wastes no time with pleasantries, instead lends itself to a more direct confrontational approach. \n\nThe Bleach version features a white paintjob.
item_Descnone_smg_energy_01=Manufacturer: Unknown\nItem Type: SMG\nClass: Energy (Laser)\n\nBattery Size: 60\nRate Of Fire: 800 rpm\nEffective Range: 30 m\n\nScrapped together from whatever parts and pieces were available, the Ripper SMG can probably do enough damage to get you out of a tight spot. Just be ready for things to get messy.
item_Descnvtc_optics_rdot_x1_s1_firerats01=Manufacturer: NV-TAC \nType: Reflex\nAttachment Point: Optic\nMagnification: 1x - 3x\nAim Time: +2.5%\nRecoil Smoothness: +10%\nSize: 1\n\nIdeal for civilians and professionals, the Delta non-magnifying reflex sight from NV-TAC provides a precise illuminated target marker, visible across a wide range of light levels. The Scorched edition features a unique flame patina.
item_Descnvtc_optics_tsco_x4_s2_firerats01=Manufacturer: NV-TAC \nType: Telescopic\nAttachment Point: Optic  \nMagnification: 2x - 4x\nAim Time: +5%\nRecoil Smoothness: +10%\nSize: 2\n\nThe Tau Plus 4x telescopic sight from NV-TAC uses a proprietary optics coating to ensure a crystal clear image regardless of light levels and conditions, allowing you to precisely engage targets at medium range. The Scorched edition features a unique flame patina.
item_Descvolt_optics_tsco_x8_s3_store01=Manufacturer: VOLT\nType: Telescopic\nAttachment Point: Optic\nMagnification: 8x\nAim Time: +0%\nSize: 3\n\nDesigned for long distance precision shooting, the FarSight is carefully crafted to provide unparalleled fidelity of targets. VOLT's TruePicture lens technology provides high levels of light transmission, ensuring easy target acquisition and daylight illumination so you always get your mark.\n\nThe Golden Blossom version is mostly black, embelished with intricate golden flowers, giving your enemies one final glimpse of life before death.
item_Descvolt_smg_energy_01_black01=Manufacturer: Verified Offworld Laser Technologies\nItem Type: SMG\nClass: Energy (Electron)\n\nBattery Size: 50\nRate of Fire: Beam\nEffective Range: 15-20 m\n\nAttachments: Optics (S1), Underbarrel (S1)\n\nManufacturer VOLT's Quartz SMG utilizes exciting new weapon technology that fires a short range beam that fractures into multiple beams the longer it fires, making it an extremely effective close quarter weapon. This special edition features Hurston branding.
