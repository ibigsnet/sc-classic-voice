RAIN_CollectResources_storm_desc_002=To all available contractors,\n\nWe at Rayari are stopping at nothing to halt the ongoing regeneration crisis, but to continue their efforts our scientists need a rare resource that the company's suppliers cannot obtain. \n\nRayari is seeking an experienced contractor to gather <EM4>irradiated valakkar pearls</EM4>, which can be extracted from adult valakkar that have been extensively exposed to radiation. Our scans have found a qualifying population inside the storm near <EM4>~mission(Location)</EM4>. Because these animals are highly dangerous, Rayari is prepared to generously compensate anyone who can assist with gathering the pearls. \n\nOnce attained, please take these valuable resources to <EM4>~mission(Destination|Address)</EM4>.\n\nTogether we can make the universe better for all.\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing
RAIN_intro_desc_01=To all available contractors,\n\nRayari Incorporated is looking for independent contractors to provide additional support in our efforts to push the boundaries of science, agriculture, and medicine in the Empire and beyond. \n\nA research initiative at <EM4>~mission(Destination|Address)</EM4> is in desperate need of resources, so we are looking for a reliable contractor to obtain and deliver these crucial components.\n\nFor more information on the animals in question, refer to "The Guide to Stanton Wildlife" in your Journal.\n\nRayari offers competitive wages along with the knowledge that you're building a better universe.\n\nLet’s grow together,\n\nNarina Lerrem\nSenior Manager\nClinical Research Outsourcing
