Shubin_Industrial_HandMining_Nyx_S_Interstellar_Desc_002=POSTING: Industrial\nLOCATION: ~mission(System)\nREQ EXPERIENCE: Hand Mining\n\nTERMS*: \n\nShubin Interstellar is in need of a variety of ore, mineable from numerous locations across <EM4>~mission(System)</EM4>.\n\n~mission(Hint_Location)\n\nFor a comprehensive list of where to find these minerals, consult <EM4>Mining Fundamentals #2: Where to Mine</EM4> in your mobiGlas Journal.\n\nAll Shubin Interstellar contractors are expected to provide their own equipment. For this contract you will need a <EM4>~mission(Hint_Tool)</EM4>.\n\nProspectors have reported kopion sightings within these caves, so caution is advised.\n\nOnce you have successfully gathered the materials, deposit them in the freight elevator located at <EM4>~mission(Destination|Address)</EM4>.\n\nDISCLAIMER: As many of these sites have been designated as abandoned or otherwise untenable, Shubin Interstellar is willing to award contractors by <EM4>allowing them to keep any surplus materials that they obtain from this contract</EM4>. This surplus can be sold at a local kiosk at the contractor's discretion.\n\n\n*Shubin Interstellar is an equal opportunity contractor. By accepting this contract you are assuming any and all risks associated with the work outlined herein and in no way can Shubin Interstellar be held accountable for any damages accrued during the duration of the contract.
