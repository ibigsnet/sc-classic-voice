Stanton3a_Desc,P=This icy moon features active cryogeysers and cryovolcanoes.\n\nPotential Ship Mineables:\nBeryl\nHephasestanite\nAgricium\nLaranite\nBorase\nGold\nTaranite\nBexalite\nQuantanium\nQuartz\nCorundum\nTungsten\n\nPotential Hand Mineables:\nHadanite\nAphorite\nDolivine
headhunters_Nyx_bombingrun_M_desc_001=Seems we got a bit of competition out here in Nyx. Scouts have spotted a gang holding up at  <EM4>~mission(Location|Address)</EM4>.\n\nNow, I'm a fair man. I sent these nullbrains a message saying they either vacate the facility or we make them wish they had, and they made their choice. So now I need you to fly over there and bomb the life out of the fuel tanks. Let's see how long they stick around without them.\n\n-Stows out
headhunters_bombingrun_S_desc_001=We've heard news that a new gang are planning a bombing run on a place over at <EM4>~mission(Location|Address)</EM4>. They figure if they can take out the fuel supplies there then it's theirs for the taking.\n\nBut little do they know that we're gonna send you in first to blow the fuel tanks so we can claim the place before they do. If it all goes to plan, we can clear the location out and stick it to that gang at the same time. Two birds, one stone.\n\nOnly problem is this place is armed to the teeth. Bring a crew and get those fuel tanks out of action. We'll take care of the rest.\n\n-Stows out
headhunters_bombingrun_multi_E_CFP_desc_001=Every day it seems like Citizens for Prosperity is out here trying to snatch up more people for their shitty little cause and make life more difficult for hardworkin' folks like ourselves. \n\nI figure they could use a reminder about who really is in charge here. Head to ~mission(Location|Address) and bomb the living hell out of the area. \n\nNothing like a bit of property damage to get a point across.\n\n-Stows out
item_Desc_ops_pants_02_01_01=Carrying Capacity: 0.5K µSCU\n\nCut to a narrow fit, OpalSky's Mivaldi pants feature bold asymmetrical design with smart yet casual dual material styling, making it the perfect addition to any wardrobe.\n\nWomen's sizes currently out of stock.
vehicle_DescAEGS_Retaliator=Manufacturer: Aegis Dynamics\nFocus: Heavy Gunship\n\nThis civilian refit of the Retaliator updates the military ship's chassis with unladen space able to be fitted with various modules to suit your needs.
